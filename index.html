&lt;div class=&quot;button-row&quot;&gt;

&lt;section id=&quot;opening&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;story-panel compact-opening&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot;&gt;Audience&lt;/div&gt;
&lt;div class=&quot;narration&quot;&gt;
&lt;p&gt;This is for the woman who wants to grow food but does &lt;strong&gt;not&lt;/strong&gt; want gardening to become a full-time job.&lt;/p&gt;
&lt;p&gt;It is for the woman who has watched videos where somebody joyfully harvests 47 heirloom cabbages before sunrise while somehow also baking sourdough and casually raising a goat named Clementine.&lt;/p&gt;
&lt;p&gt;Meanwhile, you’re just trying to keep one tomato alive and remember where you left your coffee.&lt;/p&gt;
&lt;p class=&quot;beat&quot;&gt;&lt;strong&gt;This garden is for us:&lt;/strong&gt; the tired women, the busy women, the overwhelmed women. The women who accidentally killed mint, which experts insist is impossible.&lt;/p&gt;
&lt;p class=&quot;tight-list&quot;&gt;&lt;strong&gt;You do not need to wake up at 5 a.m.&lt;/strong&gt; You do not need matching baskets, a floral apron, or emotional support chickens.&lt;/p&gt;
&lt;p&gt;You just need a little dirt, a little sunlight, and a garden that fits your actual life.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;h2 class=&quot;section-title&quot;&gt;This is not a gardening course for perfectionists.&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;This is a garden built around reality: limited time, unpredictable weather, dirty laundry, questionable motivation, and the occasional zucchini that appears overnight like it has a personal vendetta.&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h3&gt;This course contains&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Low-maintenance gardening systems&lt;/li&gt;
&lt;li&gt;Beginner-friendly vegetables that actually feed people&lt;/li&gt;
&lt;li&gt;Simple routines that do not require becoming one with the soil&lt;/li&gt;
&lt;li&gt;Permission to be wildly imperfect&lt;/li&gt;
&lt;li&gt;Mild emotional support&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h3&gt;This course does not contain&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Judgment&lt;/li&gt;
&lt;li&gt;4 a.m. watering schedules&lt;/li&gt;
&lt;li&gt;Latin plant terminology&lt;/li&gt;
&lt;li&gt;Twelve-step composting rituals&lt;/li&gt;
&lt;li&gt;Artisan herb-drying stations&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;h2 class=&quot;section-title&quot;&gt;The “lazy but productive” starter crops&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;These are the crops learners will follow through the course: practical, high-reward foods that can make a beginner feel like a garden genius with only occasional panic.&lt;/p&gt;
&lt;div class=&quot;produce-grid&quot;&gt;
&lt;div class=&quot;produce&quot;&gt;&lt;div class=&quot;emoji&quot;&gt;🥒&lt;/div&gt;&lt;strong&gt;Zucchini&lt;/strong&gt;&lt;small&gt;Produces aggressively&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;produce&quot;&gt;&lt;div class=&quot;emoji&quot;&gt;🍅&lt;/div&gt;&lt;strong&gt;Tomatoes&lt;/strong&gt;&lt;small&gt;Divas with benefits&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;produce&quot;&gt;&lt;div class=&quot;emoji&quot;&gt;🫑&lt;/div&gt;&lt;strong&gt;Peppers&lt;/strong&gt;&lt;small&gt;Quiet achievers&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;produce&quot;&gt;&lt;div class=&quot;emoji&quot;&gt;🥔&lt;/div&gt;&lt;strong&gt;Potatoes&lt;/strong&gt;&lt;small&gt;Buried treasure&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;produce&quot;&gt;&lt;img alt=&quot;Cartoon butternut squash&quot; class=&quot;produce-img&quot; src=&quot;https://cestuve.github.io/garden/butternut.png&quot;/&gt;&lt;strong&gt;Butternut Squash&lt;/strong&gt;&lt;small&gt;Stores like a champ&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;episodes&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;h2 class=&quot;section-title&quot;&gt;Course episodes&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;Instead of formal lessons, this course unfolds like a cozy, funny growing-season story. Each episode teaches one useful system while reminding learners they are not failing at gardening; gardening is simply dramatic.&lt;/p&gt;
&lt;div class=&quot;episodes&quot;&gt;
&lt;article class=&quot;episode&quot; data-icon=&quot;☕&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;episode-number&quot;&gt;Episode 1&lt;/div&gt;
&lt;h3&gt;You Are Not a Bad Gardener&lt;/h3&gt;
&lt;p&gt;Normalize beginner mistakes, garden overwhelm, and the myth that everyone else knows what they are doing.&lt;/p&gt;
&lt;/div&gt;
&lt;/article&gt;
&lt;article class=&quot;episode&quot; data-icon=&quot;🥒&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;episode-number&quot;&gt;Episode 2&lt;/div&gt;
&lt;h3&gt;The Zucchini Incident&lt;/h3&gt;
&lt;p&gt;Learn spacing, overplanting prevention, harvesting, and why one zucchini plant is often enough for a peaceful life.&lt;/p&gt;
&lt;/div&gt;
&lt;/article&gt;
&lt;article class=&quot;episode&quot; data-icon=&quot;🍅&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;episode-number&quot;&gt;Episode 3&lt;/div&gt;
&lt;h3&gt;Tomatoes Are Drama&lt;/h3&gt;
&lt;p&gt;Support, prune, water, and emotionally survive tomatoes without turning them into a second career.&lt;/p&gt;
&lt;/div&gt;
&lt;/article&gt;
&lt;article class=&quot;episode&quot; data-icon=&quot;🫑&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;episode-number&quot;&gt;Episode 4&lt;/div&gt;
&lt;h3&gt;The Quiet Competence of Peppers&lt;/h3&gt;
&lt;p&gt;Grow calm, low-maintenance peppers that quietly succeed while the rest of the garden is having emotional problems.&lt;/p&gt;
&lt;/div&gt;
&lt;/article&gt;
&lt;article class=&quot;episode&quot; data-icon=&quot;🥔&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;episode-number&quot;&gt;Episode 5&lt;/div&gt;
&lt;h3&gt;Potatoes and Buried Hope&lt;/h3&gt;
&lt;p&gt;Learn hilling, containers, and harvest timing while discovering the strange joy of digging hidden potatoes out of the dirt like treasure.&lt;/p&gt;
&lt;/div&gt;
&lt;/article&gt;
&lt;article class=&quot;episode&quot; data-icon=&quot;&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;episode-number&quot;&gt;Episode 6&lt;/div&gt;
&lt;h3&gt;The Butternut Situation&lt;/h3&gt;
&lt;p&gt;Manage sprawling squash vines, prevent garden takeovers, and learn how to cure and store butternut squash for cozy fall meals.&lt;/p&gt;
&lt;/div&gt;
&lt;img alt=&quot;Butternut squash&quot; src=&quot;https://cestuve.github.io/garden/butternut.png&quot; style=&quot;position:absolute;right:18px;bottom:12px;width:86px;height:86px;object-fit:contain;opacity:.16;pointer-events:none;&quot;/&gt;
&lt;/article&gt;
&lt;article class=&quot;episode&quot; data-icon=&quot;💧&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;episode-number&quot;&gt;Episode 7&lt;/div&gt;
&lt;h3&gt;The Lazy Watering Method&lt;/h3&gt;
&lt;p&gt;Build watering and mulching habits that keep tomatoes, peppers, zucchini, potatoes, and butternut alive without turning gardening into a full-time responsibility.&lt;/p&gt;
&lt;/div&gt;
&lt;/article&gt;
&lt;article class=&quot;episode&quot; data-icon=&quot;🧺&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;episode-number&quot;&gt;Episode 8&lt;/div&gt;
&lt;h3&gt;Harvest Redemption&lt;/h3&gt;
&lt;p&gt;Harvest, store, freeze, cook, and share your vegetables before the produce takes over your kitchen and starts making decisions.&lt;/p&gt;
&lt;/div&gt;
&lt;/article&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;h2 class=&quot;section-title&quot;&gt;A quick learner choice&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;This kind of interaction can appear throughout the course to make the learner feel coached, not lectured.&lt;/p&gt;
&lt;div class=&quot;interactive&quot;&gt;
&lt;div class=&quot;card choice&quot;&gt;
&lt;h3&gt;Your garden is looking feral in July. What do you do first?&lt;/h3&gt;
&lt;button onclick=&quot;showFeedback('A')&quot;&gt;A. Panic-scroll gardening videos and consider moving.&lt;/button&gt;
&lt;button onclick=&quot;showFeedback('C')&quot;&gt;B. Buy eight more plants because surely that will fix the vibe.&lt;/button&gt;
&lt;button onclick=&quot;showFeedback('B')&quot;&gt;C. Pick one 15-minute task: water deeply, harvest what is ready, or mulch one messy area.&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;feedback&quot; id=&quot;feedback&quot;&gt;
&lt;h3&gt;Choose an answer.&lt;/h3&gt;
&lt;p&gt;The Lazy Woman’s Garden is about small, sane actions. The garden does not need a hero. It needs 15 minutes and a woman who still has coffee somewhere.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;quote&quot;&gt;
&lt;p&gt;You are not trying to win the county fair. You are trying to grow dinner without losing your will to live.&lt;/p&gt;
&lt;span&gt;The Lazy Woman’s Garden philosophy&lt;/span&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;footer class=&quot;footer&quot;&gt;
&lt;h2&gt;Grow food. Keep your peace.&lt;/h2&gt;
&lt;p&gt;By the end of this course, learners will know how to start a realistic garden, choose forgiving crops, create lazy routines, troubleshoot common problems, and harvest without overwhelm.&lt;/p&gt;
&lt;a class=&quot;btn primary&quot; href=&quot;#&quot; onclick=&quot;parent.postMessage({type:'garden-go', target:'episode-1'}, '*'); return false;&quot;&gt;Start Episode 1&lt;/a&gt;
&lt;/footer&gt;

    .seed-packet:nth-child(3){right:11%;top:26%;transform:rotate(-3deg);animation-delay:1.2s}
    .seed-packet:nth-child(4){left:24%;bottom:13%;transform:rotate(9deg);animation-delay:1.7s}
    .seed-packet:nth-child(5){right:24%;bottom:16%;transform:rotate(-7deg);animation-delay:2.1s}

    .sticky-note{

    .choice{

    .feedback-box{

    .garden-layout{

    .crop-bed{

      border-radius:999px;

    .rating-fill{

    .rating small{
      color:#5b3f2f;

    }

    .tiny-win-visual{

    .watering-can{
      position:absolute;
      left:13%;
      bottom:19%;
      width:190px;height:110px;

      box-shadow:var(--soft-shadow);

    .watering-can::before{
      content:&quot;&quot;;
      position:absolute;

      width:96px;height:24px;
      background:#4f6f52;
      border-radius:999px;
      transform:rotate(-16deg);

    .watering-can::after{
      content:&quot;&quot;;
      position:absolute;
      left:38px;top:-40px;

      border-radius:44px 44px 0 0;

      top:35%;

    .healthy-tomato{
      position:absolute;
      right:18%;
      bottom:18%;
      width:130px;height:220px;
    }

      content:&quot;&quot;;

    .tomato-dot{

      width:42px;height:42px;border-radius:50%;

    @keyframes pulseSun{0%,100%{transform:scale(1);opacity:.86}50%{transform:scale(1.06);opacity:1}}
    @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
    @keyframes mugBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
    @keyframes steamRise{0%{transform:translateY(18px) scale(.68);opacity:0}32%{opacity:.95}100%{transform:translateY(-34px) scale(1.22);opacity:0}}
    @keyframes floatCard{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(var(--r,0deg))}}
    @keyframes growIn{from{transform:translateX(-50%) translateY(24px) scale(.88);opacity:.75}to{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
    @keyframes rainDrift{from{transform:translateY(-8px);opacity:0}30%{opacity:.9}to{transform:translateY(88px);opacity:0}}
    @keyframes tomatoPop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

      grid-row:3;

&lt;/style&gt;

&lt;body&gt;
&lt;main aria-live=&quot;polite&quot; class=&quot;course-shell&quot;&gt;
&lt;div class=&quot;progress-wrap&quot;&gt;
&lt;div aria-hidden=&quot;true&quot; class=&quot;progress-track&quot;&gt;&lt;div class=&quot;progress-bar&quot; id=&quot;progressBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;progress-label&quot; id=&quot;progressLabel&quot;&gt;1 / 12&lt;/div&gt;
&lt;/div&gt;
&lt;!-- Scene 1 --&gt;
&lt;section class=&quot;scene active&quot; data-title=&quot;Opening Cinematic&quot; style=&quot;--scene-bg:linear-gradient(180deg,#ffe0a3 0%,#c7b883 45%,#789363 100%);&quot;&gt;
&lt;div class=&quot;scene-card&quot;&gt;
&lt;div class=&quot;text-side&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot;&gt;Episode 1 · Early Spring&lt;/div&gt;
&lt;h1&gt;You Are Not a Bad Gardener&lt;/h1&gt;
&lt;p class=&quot;subtitle&quot;&gt;Before we plant anything, we need to talk about the lie that everyone else knows what they’re doing.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;visual-side image-visual&quot;&gt;
&lt;img alt=&quot;Perfect influencer garden with glowing vegetables and organized baskets&quot; class=&quot;hosted-scene-image&quot; src=&quot;https://cestuve.github.io/garden/perfectgarden.png&quot; style=&quot;position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center center; display:block; padding:0; background:transparent;&quot;/&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- Scene 2 --&gt;
&lt;section class=&quot;scene&quot; data-title=&quot;The Internet Lied&quot;&gt;
&lt;div class=&quot;scene-card&quot;&gt;
&lt;div class=&quot;text-side&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot;&gt;Opening Cinematic&lt;/div&gt;
&lt;h2&gt;The Internet Lied to Me&lt;/h2&gt;
&lt;div class=&quot;copy&quot;&gt;
&lt;p&gt;The internet will make you believe gardening is peaceful.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;The internet is lying.&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;According to social media, gardening involves softly gathering vegetables in a linen apron while acoustic music plays somewhere in the distance.&lt;/p&gt;
&lt;p&gt;In reality, I once panic-watered tomatoes in pajamas while eating a granola bar.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;visual-side image-visual&quot;&gt;
&lt;img alt=&quot;Woman watering plants in pajamas&quot; class=&quot;hosted-scene-image&quot; src=&quot;https://cestuve.github.io/garden/wateringpjs.png&quot; style=&quot;position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center center; display:block; padding:0; background:transparent;&quot;/&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- Scene 3 --&gt;
&lt;section class=&quot;scene&quot; data-title=&quot;Internet Fantasy&quot;&gt;
&lt;div class=&quot;scene-card&quot;&gt;
&lt;div class=&quot;text-side&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot;&gt;Part 1 · The perfect garden fantasy&lt;/div&gt;
&lt;h2&gt;According to the Internet…&lt;/h2&gt;
&lt;div class=&quot;copy&quot;&gt;
&lt;p&gt;Every garden is glowing. Every basket is overflowing. Every goat is calmly posing near a rustic fence like it has a management team.&lt;/p&gt;
&lt;p&gt;And somehow, everyone has already built a trellis from reclaimed wood.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;visual-side&quot;&gt;
&lt;div class=&quot;pinterest-grid large-cards&quot;&gt;
&lt;div class=&quot;fantasy-card&quot; style=&quot;--r:-3deg&quot;&gt;🧺&lt;small&gt;Overflowing harvest&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;fantasy-card trellis-card&quot; style=&quot;--r:2deg&quot;&gt;
&lt;div class=&quot;trellis-graphic&quot;&gt;
&lt;div class=&quot;wood wood1&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;wood wood2&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;wood wood3&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;wood wood4&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;vine vine1&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;vine vine2&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;small&gt;Reclaimed wood trellis&lt;/small&gt;
&lt;/div&gt;
&lt;div class=&quot;fantasy-card&quot; style=&quot;--r:3deg&quot;&gt;🐐&lt;small&gt;Clementine is thriving&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;fantasy-card&quot; style=&quot;--r:-2deg&quot;&gt;🌻&lt;small&gt;Suspiciously perfect&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- Scene 4 --&gt;
&lt;section class=&quot;scene&quot; data-title=&quot;Reality&quot;&gt;
&lt;div class=&quot;scene-card&quot;&gt;
&lt;div class=&quot;text-side&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot;&gt;Part 2 · Reality&lt;/div&gt;
&lt;h2&gt;Meanwhile…&lt;/h2&gt;
&lt;div class=&quot;copy&quot;&gt;
&lt;p&gt;There is a tangled hose.&lt;/p&gt;
&lt;p&gt;The tomato cage has given up emotionally.&lt;/p&gt;
&lt;p&gt;Your coffee is cold.&lt;/p&gt;
&lt;p&gt;And one pepper plant is looking at you like it expected more.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;visual-side image-visual&quot;&gt;
&lt;img alt=&quot;Messy garden with tangled hose and struggling plants&quot; class=&quot;hosted-scene-image&quot; src=&quot;https://cestuve.github.io/garden/messygarden.png&quot; style=&quot;position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center center; display:block; padding:0; background:transparent;&quot;/&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- Scene 5 Seasonal transition --&gt;
&lt;section class=&quot;scene&quot; data-title=&quot;Early Spring Transition&quot; style=&quot;--scene-bg:linear-gradient(180deg,#ffd98a 0%,#aabf84 52%,#557043 100%);&quot;&gt;
&lt;div class=&quot;scene-card full&quot; style=&quot;background:rgba(39,63,45,.5);border-color:rgba(255,255,255,.28);&quot;&gt;
&lt;div class=&quot;season-card&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot; style=&quot;background:rgba(255,247,234,.16);color:#ffe7ad;border-color:rgba(255,255,255,.24);margin-inline:auto;&quot;&gt;Seasonal Transition&lt;/div&gt;
&lt;h2&gt;Early Spring&lt;/h2&gt;
&lt;p&gt;The season of dangerous optimism&lt;/p&gt;
&lt;p class=&quot;season-subline&quot;&gt;Early spring has arrived: the season when hope is high and your cart is full.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- Scene 6 Garden delusion --&gt;
&lt;section class=&quot;scene&quot; data-title=&quot;Garden Delusion&quot;&gt;
&lt;div class=&quot;scene-card&quot;&gt;
&lt;div class=&quot;text-side&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot;&gt;Part 3 · The delusion phase&lt;/div&gt;
&lt;h2&gt;Every Spring…&lt;/h2&gt;
&lt;div class=&quot;copy&quot;&gt;
&lt;p&gt;I become absolutely convinced I can manage significantly more plants than any reasonable person should.&lt;/p&gt;
&lt;p&gt;This is called &lt;strong&gt;Garden Delusion&lt;/strong&gt;.&lt;/p&gt;
&lt;p&gt;Symptoms include buying twelve tomato plants, believing zucchini is “manageable,” and suddenly using the phrase “heirloom varieties” with confidence.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;visual-side image-visual&quot;&gt;
&lt;img alt=&quot;Garden center delusion with overflowing plants&quot; class=&quot;hosted-scene-image&quot; src=&quot;https://cestuve.github.io/garden/delusion.png&quot; style=&quot;position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center center; display:block; padding:0; background:transparent;&quot;/&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- Scene 7 emotional honesty --&gt;
&lt;section class=&quot;scene&quot; data-title=&quot;Emotional Honesty&quot; style=&quot;--scene-bg:linear-gradient(180deg,#ddd2bd 0%,#a99b82 55%,#667458 100%);&quot;&gt;
&lt;div class=&quot;scene-card&quot;&gt;
&lt;div class=&quot;text-side&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot;&gt;Part 4 · Emotional honesty&lt;/div&gt;
&lt;h2&gt;Maybe I’m Just Bad At This&lt;/h2&gt;
&lt;div class=&quot;copy&quot;&gt;
&lt;p&gt;I used to think struggling with gardening meant I was failing.&lt;/p&gt;
&lt;p&gt;But gardening is not a talent competition.&lt;/p&gt;
&lt;p&gt;It is mostly weather, dirt, bugs, timing, and emotional resilience.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;visual-side&quot;&gt;
&lt;div class=&quot;reality-card-grid&quot;&gt;
&lt;div class=&quot;reality-card top-card&quot;&gt;
&lt;div class=&quot;reality-icon&quot;&gt;☀️&lt;/div&gt;
&lt;h3&gt;Weather&lt;/h3&gt;
&lt;p&gt;Frequently dramatic&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;reality-card top-card&quot;&gt;
&lt;div class=&quot;reality-icon&quot;&gt;🌱&lt;/div&gt;
&lt;h3&gt;Dirt&lt;/h3&gt;
&lt;p&gt;Surprisingly important&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;reality-card&quot;&gt;
&lt;div class=&quot;reality-icon&quot;&gt;🐛&lt;/div&gt;
&lt;h3&gt;Bugs&lt;/h3&gt;
&lt;p&gt;Uninvited collaborators&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;reality-card&quot;&gt;
&lt;div class=&quot;reality-icon&quot;&gt;⏰&lt;/div&gt;
&lt;h3&gt;Timing&lt;/h3&gt;
&lt;p&gt;Extremely judgmental&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;reality-card&quot;&gt;
&lt;div class=&quot;reality-icon&quot;&gt;💚&lt;/div&gt;
&lt;h3&gt;Emotional resilience&lt;/h3&gt;
&lt;p&gt;The real crop&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- Scene 8 interaction --&gt;
&lt;section class=&quot;scene&quot; data-title=&quot;Interaction&quot;&gt;
&lt;div class=&quot;scene-card full&quot;&gt;
&lt;div class=&quot;text-side&quot;&gt;
&lt;div class=&quot;eyebrow&quot;&gt;Interaction · Choose your spring gardening identity&lt;/div&gt;
&lt;h2&gt;Which gardener are you?&lt;/h2&gt;
&lt;p class=&quot;subtitle&quot;&gt;Choose the spring mistake that feels most personally accurate. There is no judgment, only gentle recognition.&lt;/p&gt;
&lt;div class=&quot;choice-grid&quot;&gt;
&lt;button class=&quot;choice&quot; onclick=&quot;showGardenerFeedback('A')&quot;&gt;A. Buying plants before knowing where they will go&lt;/button&gt;
&lt;button class=&quot;choice&quot; onclick=&quot;showGardenerFeedback('B')&quot;&gt;B. Planting vegetables nobody in the household actually eats&lt;/button&gt;
&lt;button class=&quot;choice&quot; onclick=&quot;showGardenerFeedback('C')&quot;&gt;C. Becoming emotionally attached to one struggling tomato plant&lt;/button&gt;
&lt;button class=&quot;choice&quot; onclick=&quot;showGardenerFeedback('D')&quot;&gt;D. Starting aggressively and disappearing emotionally by July&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;feedback-box&quot; id=&quot;gardenerFeedback&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- Scene 9 rules --&gt;
&lt;section class=&quot;scene&quot; data-title=&quot;Lazy Philosophy&quot;&gt;
&lt;div class=&quot;scene-card full&quot;&gt;
&lt;div class=&quot;text-side&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot;&gt;Part 5 · The Lazy Woman’s Rules&lt;/div&gt;
&lt;h2&gt;The goal is not perfection.&lt;/h2&gt;
&lt;p class=&quot;subtitle&quot;&gt;These are the Lazy Woman’s Rules. They are not rules because we love rules. They are rules because July is coming, and July has opinions.&lt;/p&gt;
&lt;div class=&quot;rules&quot;&gt;
&lt;div class=&quot;rule&quot;&gt;&lt;div&gt;&lt;div class=&quot;num&quot;&gt;Rule 1&lt;/div&gt;&lt;strong&gt;Grow what you actually eat&lt;/strong&gt;&lt;/div&gt;&lt;span&gt;🍽️&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;rule&quot;&gt;&lt;div&gt;&lt;div class=&quot;num&quot;&gt;Rule 2&lt;/div&gt;&lt;strong&gt;Fewer plants = less stress&lt;/strong&gt;&lt;/div&gt;&lt;span&gt;🌱&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;rule&quot;&gt;&lt;div&gt;&lt;div class=&quot;num&quot;&gt;Rule 3&lt;/div&gt;&lt;strong&gt;Mulch like your sanity depends on it&lt;/strong&gt;&lt;/div&gt;&lt;span&gt;🍂&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;rule&quot;&gt;&lt;div&gt;&lt;div class=&quot;num&quot;&gt;Rule 4&lt;/div&gt;&lt;strong&gt;Consistency beats intensity&lt;/strong&gt;&lt;/div&gt;&lt;span&gt;⏱️&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;rule&quot;&gt;&lt;div&gt;&lt;div class=&quot;num&quot;&gt;Rule 5&lt;/div&gt;&lt;strong&gt;Ignore perfection&lt;/strong&gt;&lt;/div&gt;&lt;span&gt;✨&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- Scene 10 Seasonal transition 2 --&gt;
&lt;section class=&quot;scene&quot; data-title=&quot;Spring Deepens&quot; style=&quot;--scene-bg:linear-gradient(180deg,#ffe7ad 0%,#91aa70 48%,#3f6740 100%);&quot;&gt;
&lt;div class=&quot;scene-card full&quot; style=&quot;background:rgba(39,63,45,.5);border-color:rgba(255,255,255,.28);&quot;&gt;
&lt;div class=&quot;season-card&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot; style=&quot;background:rgba(255,247,234,.16);color:#ffe7ad;border-color:rgba(255,255,255,.24);margin-inline:auto;&quot;&gt;Seasonal Transition&lt;/div&gt;
&lt;h2&gt;Spring Deepens&lt;/h2&gt;
&lt;p&gt;The garden is still imperfect. This is good—so are most living things.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- Scene 11 First lazy garden --&gt;
&lt;section class=&quot;scene&quot; data-title=&quot;First Lazy Garden&quot;&gt;
&lt;div class=&quot;scene-card&quot;&gt;
&lt;div class=&quot;text-side&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot;&gt;Part 6 · Your first lazy garden&lt;/div&gt;
&lt;h2&gt;Start Smaller Than Your Delusions&lt;/h2&gt;
&lt;div class=&quot;copy&quot;&gt;
&lt;p&gt;A successful first garden does not need 37 crops.&lt;/p&gt;
&lt;p&gt;Start with a few high-reward foods you actually want to eat.&lt;/p&gt;
&lt;p&gt;For this course, we will begin with tomatoes, zucchini, peppers, potatoes, and butternut.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;crop-ratings&quot;&gt;
&lt;div class=&quot;rating&quot;&gt;&lt;strong&gt;Tomatoes&lt;/strong&gt;&lt;div class=&quot;rating-bar&quot;&gt;&lt;div class=&quot;rating-fill&quot; style=&quot;--w:72%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;small&gt;Emotionally complex&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;rating&quot;&gt;&lt;strong&gt;Zucchini&lt;/strong&gt;&lt;div class=&quot;rating-bar&quot;&gt;&lt;div class=&quot;rating-fill&quot; style=&quot;--w:88%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;small&gt;Aggressive&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;rating&quot;&gt;&lt;strong&gt;Peppers&lt;/strong&gt;&lt;div class=&quot;rating-bar&quot;&gt;&lt;div class=&quot;rating-fill&quot; style=&quot;--w:48%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;small&gt;Quiet achievers&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;rating&quot;&gt;&lt;strong&gt;Potatoes&lt;/strong&gt;&lt;div class=&quot;rating-bar&quot;&gt;&lt;div class=&quot;rating-fill&quot; style=&quot;--w:42%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;small&gt;Supportive&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;rating&quot;&gt;&lt;strong&gt;Butternut&lt;/strong&gt;&lt;div class=&quot;rating-bar&quot;&gt;&lt;div class=&quot;rating-fill&quot; style=&quot;--w:58%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;small&gt;Patient storage queen&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;visual-side&quot;&gt;
&lt;div class=&quot;garden-layout five-crops veggie-only&quot;&gt;
&lt;div class=&quot;crop-bed&quot; data-emoji=&quot;🍅&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;crop-bed&quot; data-emoji=&quot;🥒&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;crop-bed&quot; data-emoji=&quot;🫑&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;crop-bed&quot; data-emoji=&quot;🥔&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;crop-bed squash-bed&quot;&gt;&lt;img alt=&quot;Butternut squash&quot; class=&quot;butternut-img&quot; src=&quot;https://cestuve.github.io/garden/butternut.png&quot;/&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- Scene 12 Tiny wins --&gt;
&lt;section class=&quot;scene&quot; data-title=&quot;Tiny Wins&quot;&gt;
&lt;div class=&quot;scene-card&quot;&gt;
&lt;div class=&quot;text-side&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot;&gt;Part 7 · Tiny wins&lt;/div&gt;
&lt;h2&gt;Tiny Counts&lt;/h2&gt;
&lt;div class=&quot;copy&quot;&gt;
&lt;p&gt;A successful garden does not require a complete lifestyle transformation.&lt;/p&gt;
&lt;p&gt;Sometimes success looks like watering three plants and trying again tomorrow.&lt;/p&gt;
&lt;p&gt;This garden is not about building an agricultural empire. It is about building a garden you can maintain without needing a second personality.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;visual-side image-visual&quot;&gt;
&lt;img alt=&quot;Tiny garden with three healthy plants and watering can&quot; class=&quot;hosted-scene-image&quot; src=&quot;https://cestuve.github.io/garden/tinygarden.png&quot; style=&quot;position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center center; display:block; padding:0; background:transparent;&quot;/&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- Scene 13 End --&gt;
&lt;section class=&quot;scene&quot; data-title=&quot;End&quot; style=&quot;--scene-bg:linear-gradient(180deg,#f5c47e 0%,#a1764e 45%,#3d5536 100%);&quot;&gt;
&lt;div class=&quot;scene-card full&quot;&gt;
&lt;div class=&quot;end-card&quot;&gt;
&lt;div class=&quot;eyebrow sans&quot; style=&quot;margin-inline:auto;&quot;&gt;End of Episode 1&lt;/div&gt;
&lt;h2&gt;Start Where You Are&lt;/h2&gt;
&lt;p class=&quot;subtitle&quot; style=&quot;margin-inline:auto;&quot;&gt;You do not need a perfect garden. You need a garden that makes you want to come back tomorrow.&lt;/p&gt;

    const scenes = Array.from(document.querySelectorAll('.scene'));
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const sceneCount = document.getElementById('sceneCount');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    let current = 0;

    function updateScene(){
      scenes.forEach((scene, i) =&gt; scene.classList.toggle('active', i === current));
      const total = scenes.length;
      progressBar.style.width = ((current + 1) / total * 100) + '%';
      progressLabel.textContent = `${current + 1} / ${total}`;
      if (sceneCount) sceneCount.textContent = `Scene ${current + 1} of ${total}`;
      backBtn.disabled = current === 0;
      nextBtn.textContent = current === total - 1 ? 'Episode 2' : 'Next';
      window.scrollTo(0,0);
    }

    function nextScene(){
      if(current &lt; scenes.length - 1){
        current++;
        updateScene();
      } else {
        parent.postMessage({type:'garden-go', target:'episode-2'}, '*');
      }
    }

    function prevScene(){
      if(current &gt; 0){
        current--;
        updateScene();
      }
    }

        B: {
          title:'The Kale You Never Asked For',
          text:'A garden should feed your actual life, not your aspirational salad identity. Lazy fix: grow what people in your house will genuinely eat.'
        },
        C: {
          title:'The Tomato Attachment',
          text:'We have all emotionally adopted a struggling plant. Lazy fix: care for it, but do not let one dramatic tomato define your self-worth.'
        },
        D: {
          title:'The July Disappearance',
          text:'Starting big feels heroic until the weeds unionize. Lazy fix: build routines small enough that future you will not fake her own disappearance.'
        }
      };
      box.style.display = 'block';
      box.innerHTML = `&lt;h3&gt;${responses[choice].title}&lt;/h3&gt;&lt;p&gt;${responses[choice].text}&lt;/p&gt;`;
    }

    document.addEventListener('keydown', (e) =&gt; {
      if(e.key === 'ArrowRight') nextScene();
      if(e.key === 'ArrowLeft') prevScene();
    });

    updateScene();

&lt;script&gt;
    const scenes = Array.from(document.querySelectorAll('.scene'));
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    let current = 0;

    function updateScene(){
      scenes.forEach((scene, i) =&gt; scene.classList.toggle('active', i === current));
      const total = scenes.length;
      progressBar.style.width = ((current + 1) / total * 100) + '%';
      progressLabel.textContent = `${current + 1} / ${total}`;
      backBtn.disabled = current === 0;
      nextBtn.textContent = current === total - 1 ? 'Episode 3' : 'Next';
      window.scrollTo(0,0);
    }

    function nextScene(){
      if(current &lt; scenes.length - 1){
        current++;
        updateScene();
      } else {
        parent.postMessage({type:'garden-go', target:'episode-3'}, '*');
      }
    }

    function prevScene(){
      if(current &gt; 0){
        current--;
        updateScene();
      }
    }

    function showZukeFeedback(choice){
      const box = document.getElementById('zukeFeedback');
      const responses = {
        A: {
          title:'Very reasonable',
          text:'One zucchini plant can feed many small households, especially if you harvest consistently. This is not cowardice. This is wisdom.'
        },
        B: {
          title:'Still sane',
          text:'Two plants can work if you love zucchini, have space, and are emotionally prepared to share. Keep an eye on them. They are ambitious.'
        },
        C: {
          title:'Respectfully, no',
          text:'Six zucchini plants is how neighborhoods become suspicious. Unless you are feeding a summer camp, start smaller.'
        },
        D: {
          title:'You are among friends here',
          text:'Garden center confidence is powerful. The Lazy Woman’s fix: buy fewer plants than your optimism suggests.'
        }
      };
      box.style.display = 'block';
      box.innerHTML = `&lt;h3&gt;${responses[choice].title}&lt;/h3&gt;&lt;p&gt;${responses[choice].text}&lt;/p&gt;`;
    }

    document.addEventListener('keydown', (e) =&gt; {
      if(e.key === 'ArrowRight') nextScene();
      if(e.key === 'ArrowLeft') prevScene();
    });

    updateScene();
  &lt;/script&gt;

  &lt;script&gt;
    const scenes = Array.from(document.querySelectorAll('.scene'));
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    let current = 0;

    function updateScene(){
      scenes.forEach((scene, i) =&gt; scene.classList.toggle('active', i === current));
      const total = scenes.length;
      progressBar.style.width = ((current + 1) / total * 100) + '%';
      progressLabel.textContent = `${current + 1} / ${total}`;
      backBtn.disabled = current === 0;
      nextBtn.textContent = current === total - 1 ? 'Episode 4' : 'Next';
      window.scrollTo(0,0);
    }

    function nextScene(){
      if(current &lt; scenes.length - 1){
        current++;
        updateScene();
      } else {
        parent.postMessage({type:'garden-go', target:'episode-4'}, '*');
      }
    }

    function prevScene(){
      if(current &gt; 0){
        current--;
        updateScene();
      }
    }

    function showTomatoFeedback(choice){
      const box = document.getElementById('tomatoFeedback');
      const responses = {
        A: {
          title:'A bold escalation',
          text:'More tomatoes will not solve tomato drama. First support what you already have, then decide whether your emotional bandwidth can handle additional cast members.'
        },
        B: {
          title:'Exactly',
          text:'Start with support and gentle pruning. Tie up leaning stems, improve airflow, and remove leaves touching the soil.'
        },
        C: {
          title:'Relatable, but dangerous',
          text:'Avoidance is emotionally understandable, but tomatoes interpret silence as permission. A 10-minute support-and-prune reset can save the situation.'
        }
      };
      box.style.display = 'block';
      box.innerHTML = `&lt;h3&gt;${responses[choice].title}&lt;/h3&gt;&lt;p&gt;${responses[choice].text}&lt;/p&gt;`;
    }

    document.addEventListener('keydown', (e) =&gt; {
      if(e.key === 'ArrowRight') nextScene();
      if(e.key === 'ArrowLeft') prevScene();
    });

    updateScene();

    .small-pepper-fruit{

    .sparkle{

    .sp2{right:24%;top:38%;animation-delay:.8s}

    .pepper-counter{

      position:absolute;

      bottom:10%;
      width:84%;
      height:30%;

    .pepper-shape{

      animation:calmFloat 4s ease-in-out infinite;
    }
    .pepper-shape::before{
      content:&quot;&quot;;
      position:absolute;
      left:23px;
      top:-16px;
      width:12px;
      height:24px;
      border-radius:999px;
      background:#3f7a3e;
      transform:rotate(10deg);
    }
    .green-pepper{left:23%;background:linear-gradient(180deg,#83bd57,#3f7a3e)}
    .red-pepper{left:42%;background:linear-gradient(180deg,#e36b4c,#b83f2e);animation-delay:.7s}
    .yellow-pepper{left:60%;background:linear-gradient(180deg,#ffd76a,#e3a83f);animation-delay:1.2s}

    .basket{
      position:absolute;
      left:50%;
      bottom:17%;
      width:290px;
      height:120px;

      box-shadow:0 18px 34px rgba(43,35,31,.22);
    }
    .basket::before{
      content:&quot;&quot;;
      position:absolute;
      left:30px;right:30px;top:-54px;height:92px;
      border:10px solid #8b674f;
      border-bottom:0;
      border-radius:140px 140px 0 0;
      opacity:.72;
    }
    .basket .pepper-shape{bottom:50%;transform:scale(.8)}
    .basket .green-pepper{left:26%}
    .basket .red-pepper{left:44%;bottom:62%}
    .basket .yellow-pepper{left:59%}

    .end-card{
      text-align:center;
      padding:clamp(32px,5vw,62px);
    }
    .end-card h2{font-size:clamp(42px,7vw,92px)}
    .next-episode{
      margin:24px auto 0;

    .end-match .scene-card.full{
      width:min(980px,94vw) !important;

    @keyframes pulseSun{0%,100%{transform:scale(1);opacity:.86}50%{transform:scale(1.06);opacity:1}}
    @keyframes plantBreathe{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.04)}}
    @keyframes plantBreatheMini{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
    @keyframes leafSway{0%,100%{translate:0 0}50%{translate:0 -8px}}
    @keyframes pepperGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
    @keyframes floatCard{0%,100%{translate:0 0}50%{translate:0 -10px}}

    /* Mobile */

      .copy{font-size:clamp(15px,4.1vw,20px)}
      .copy p{margin-bottom:9px}
      .learning-grid{grid-template-columns:1fr;gap:8px}
      .learn-card{min-height:auto;padding:12px}
      .learn-card .icon{font-size:28px;margin-bottom:6px}
      .choice-grid{grid-template-columns:1fr;gap:9px}
      .choice{font-size:14px;padding:12px}
      .progress-wrap{width:calc(100vw - 24px)}
      .nav{width:calc(100vw - 24px);gap:8px}
      .btn{padding:12px 15px;font-size:13px}
      .pepper-plant{transform:translateX(-50%) scale(.74);bottom:9%}
      .cart{transform:scale(.72) rotate(-3deg);transform-origin:left bottom}
      .pepper-pots{transform:scale(.72);transform-origin:left bottom}

      .transition-match .scene-card.full,
      .end-match .scene-card.full{

        height:calc(100vh - 132px) !important;
        max-height:calc(100vh - 132px) !important;
        overflow:auto !important;
        border-radius:26px !important;
      }
    }

    @media(max-width:560px){
      .scene{padding:48px 8px 70px}
      .scene-card{width:calc(100vw - 16px);height:calc(100vh - 118px);max-height:calc(100vh - 118px);border-radius:22px}

      h2{font-size:clamp(27px,10vw,44px);margin-bottom:12px}
      .subtitle{font-size:15px;line-height:1.25}
      .copy{font-size:14.5px;line-height:1.32}
      .feedback-box h3{font-size:17px}
      .feedback-box p{font-size:13px}
      .end-card{padding:24px 18px}
      .next-episode{padding:18px}
      .next-episode span{font-size:26px}
      .transition-match .scene-card.full,
      .end-match .scene-card.full{
        width:calc(100vw - 16px) !important;
        height:calc(100vh - 118px) !important;
        max-height:calc(100vh - 118px) !important;
        border-radius:22px !important;
      }
    }

&lt;body&gt;
  &lt;main class=&quot;course-shell&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;progress-wrap&quot;&gt;
      &lt;div class=&quot;progress-track&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;progress-bar&quot; id=&quot;progressBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;progress-label&quot; id=&quot;progressLabel&quot;&gt;1 / 11&lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- Scene 1 --&gt;
    &lt;section class=&quot;scene active&quot; data-title=&quot;Opening&quot; style=&quot;--scene-bg:linear-gradient(180deg,#ffe0a3 0%,#c7b883 45%,#789363 100%);&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Episode 4 · Late Summer Patience&lt;/div&gt;
          &lt;h1&gt;The Quiet Competence of Peppers&lt;/h1&gt;
          &lt;p class=&quot;subtitle&quot;&gt;Peppers are not loud plants. They are thoughtful plants.&lt;/p&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Tomatoes demand attention.&lt;/p&gt;
            &lt;p&gt;Zucchini attempts territorial expansion.&lt;/p&gt;
            &lt;p&gt;Peppers simply stand there quietly like tiny garden professionals.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        
&lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/quietpeppers2.png&quot; alt=&quot;Quiet peppers&quot; style=&quot;width:100%;height:100%;object-fit:cover;object-position:center;&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 2 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Garden Center&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 1 · Garden center optimism&lt;/div&gt;
          &lt;h2&gt;This Does Not Look Impressive Yet&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Pepper plants at the garden center always look slightly unfinished, like somebody forgot to fully develop them.&lt;/p&gt;
            &lt;p&gt;But this is part of their personality.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;They are slow starters, not failures.&lt;/strong&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        
&lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/slowpeppers2.png&quot; alt=&quot;Slow peppers&quot; style=&quot;width:100%;height:100%;object-fit:cover;object-position:center;&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 3 --&gt;
    &lt;section class=&quot;scene transition-match&quot; data-title=&quot;Heat Arrives&quot; style=&quot;--scene-bg:linear-gradient(180deg,#ffe7ad 0%,#9ab36f 48%,#3f6740 100%);&quot;&gt;
      &lt;div class=&quot;vine-wave&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;scene-card full&quot; style=&quot;background:rgba(39,63,45,.5);border-color:rgba(255,255,255,.28);&quot;&gt;
        &lt;div class=&quot;season-card&quot;&gt;
          &lt;div class=&quot;eyebrow&quot; style=&quot;background:rgba(255,247,234,.16);color:#ffe7ad;border-color:rgba(255,255,255,.24);margin-inline:auto;&quot;&gt;Seasonal Transition&lt;/div&gt;
          &lt;h2&gt;The Heat Arrives&lt;/h2&gt;
          &lt;p&gt;Peppers do not enjoy cold weather. They would actually prefer if summer became hotter.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 4 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Waiting Phase&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 2 · The waiting phase&lt;/div&gt;
          &lt;h2&gt;Peppers Operate On Pepper Time&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;At some point, every gardener begins staring at pepper plants aggressively.&lt;/p&gt;
            &lt;p&gt;This does not speed them up.&lt;/p&gt;
            &lt;p&gt;Peppers prefer warmth, consistency, and emotional boundaries.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        
&lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/calmpepper2.png&quot; alt=&quot;Calm pepper&quot; style=&quot;width:100%;height:100%;object-fit:cover;object-position:center;&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 5 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Survival Rules&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 3 · Pepper survival rules&lt;/div&gt;
          &lt;h2&gt;What Peppers Actually Need&lt;/h2&gt;
          &lt;p class=&quot;subtitle&quot;&gt;Peppers are calm, but they are not mysterious. They mostly want warmth, consistency, and time.&lt;/p&gt;
          &lt;div class=&quot;learning-grid&quot;&gt;
            &lt;div class=&quot;learn-card&quot;&gt;&lt;div class=&quot;icon&quot;&gt;☀️&lt;/div&gt;&lt;h3&gt;Heat&lt;/h3&gt;&lt;p&gt;Peppers love warmth more than almost anything.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;learn-card&quot;&gt;&lt;div class=&quot;icon&quot;&gt;💧&lt;/div&gt;&lt;h3&gt;Water&lt;/h3&gt;&lt;p&gt;Consistent watering prevents stressed plants.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;learn-card&quot;&gt;&lt;div class=&quot;icon&quot;&gt;🌱&lt;/div&gt;&lt;h3&gt;Spacing&lt;/h3&gt;&lt;p&gt;Crowded peppers become dramatic later.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;learn-card&quot;&gt;&lt;div class=&quot;icon&quot;&gt;🪴&lt;/div&gt;&lt;h3&gt;Patience&lt;/h3&gt;&lt;p&gt;Tiny peppers eventually become actual peppers.&lt;/p&gt;&lt;/div&gt;

  &lt;script&gt;
    const scenes = Array.from(document.querySelectorAll('.scene'));
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    let current = 0;

    function updateScene(){
      scenes.forEach((scene, i) =&gt; scene.classList.toggle('active', i === current));
      const total = scenes.length;
      progressBar.style.width = ((current + 1) / total * 100) + '%';
      progressLabel.textContent = `${current + 1} / ${total}`;
      backBtn.disabled = current === 0;
      nextBtn.textContent = current === total - 1 ? 'Episode 5' : 'Next';
      window.scrollTo(0,0);
    }

    function nextScene(){
      if(current &lt; scenes.length - 1){
        current++;
        updateScene();
      } else {
        parent.postMessage({type:'garden-go', target:'episode-5'}, '*');
      }
    }

    function prevScene(){
      if(current &gt; 0){
        current--;
        updateScene();
      }
    }

    function showPepperFeedback(choice){
      const box = document.getElementById('pepperFeedback');
      const responses = {
        A: {
          title:'Emotionally understandable',
          text:'Pepper panic is common, but usually unnecessary. If the plant looks healthy, it may simply be waiting for consistent warmth.'
        },
        B: {
          title:'Exactly',
          text:'Peppers are slow starters. Give them warmth, sunlight, steady watering, and time. They are not ignoring you (probably).'
        },
        C: {
          title:'Kind, but not required',
          text:'Apologies are optional. Warm soil, sunlight, and patience are more effective.'
        }
      };
      box.style.display = 'block';
      box.innerHTML = `&lt;h3&gt;${responses[choice].title}&lt;/h3&gt;&lt;p&gt;${responses[choice].text}&lt;/p&gt;`;
    }

    document.addEventListener('keydown', (e) =&gt; {
      if(e.key === 'ArrowRight') nextScene();
      if(e.key === 'ArrowLeft') prevScene();
    });

    updateScene();

      .text-side{height:auto;flex:1;padding:18px;overflow:auto;justify-content:flex-start}
      h1{font-size:clamp(36px,11vw,64px)}
      h2{font-size:clamp(30px,9vw,54px)}
      .subtitle{font-size:clamp(16px,4.6vw,22px);margin-bottom:14px}
      .copy{font-size:clamp(15px,4.1vw,20px)}
      .copy p{margin-bottom:9px}
      .learning-grid{grid-template-columns:1fr;gap:8px}
      .learn-card{min-height:auto;padding:12px}
      .learn-card .icon{font-size:28px;margin-bottom:6px}
      .choice-grid,.choice-grid.two{grid-template-columns:1fr;gap:9px}
      .choice{font-size:14px;padding:12px}
      .progress-wrap{width:calc(100vw - 24px)}
      .nav{width:calc(100vw - 24px);gap:8px}
      .btn{padding:12px 15px;font-size:13px}
      .transition-match .scene-card.full,
      .end-match .scene-card.full{
        width:96vw !important;
        height:calc(100vh - 132px) !important;
        max-height:calc(100vh - 132px) !important;
        overflow:auto !important;
        border-radius:26px !important;
      }
    }

    @media(max-width:560px){
      .scene{padding:48px 8px 70px}
      .scene-card{width:calc(100vw - 16px);height:calc(100vh - 118px);max-height:calc(100vh - 118px);border-radius:22px}
      .scene-card.full{height:calc(100vh - 118px);max-height:calc(100vh - 118px)}
      .visual-side{height:32%;max-height:190px}
      .text-side{padding:15px}
      .eyebrow{font-size:9.5px;padding:7px 10px;margin-bottom:10px}
      h1{font-size:clamp(32px,12vw,50px);margin-bottom:12px}
      h2{font-size:clamp(27px,10vw,44px);margin-bottom:12px}
      .subtitle{font-size:15px;line-height:1.25}
      .copy{font-size:14.5px;line-height:1.32}
      .feedback-box h3{font-size:17px}
      .feedback-box p{font-size:13px}
      .end-card{padding:24px 18px}
      .next-episode{padding:18px}
      .next-episode span{font-size:26px}
      .transition-match .scene-card.full,
      .end-match .scene-card.full{
        width:calc(100vw - 16px) !important;
        height:calc(100vh - 118px) !important;
        max-height:calc(100vh - 118px) !important;
        border-radius:22px !important;
      }
    }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;main class=&quot;course-shell&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;progress-wrap&quot;&gt;
      &lt;div class=&quot;progress-track&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;progress-bar&quot; id=&quot;progressBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;progress-label&quot; id=&quot;progressLabel&quot;&gt;1 / 15&lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- Scene 1 --&gt;
    &lt;section class=&quot;scene active&quot; data-title=&quot;Opening&quot; style=&quot;--scene-bg:linear-gradient(180deg,#ffe0a3 0%,#c7b883 45%,#789363 100%);&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Episode 5 · Buried Hope&lt;/div&gt;
          &lt;h1&gt;Potatoes and Buried Hope&lt;/h1&gt;
          &lt;p class=&quot;subtitle&quot;&gt;Potatoes are a quiet little miracle.&lt;/p&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;You bury something that looks deeply unimpressive, cover it with dirt, water it occasionally, and then spend several weeks wondering if anything is happening at all.&lt;/p&gt;
            &lt;p&gt;This is not failure.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;This is potatoes.&lt;/strong&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/tinysprout.png&quot; alt=&quot;Woman kneeling beside a simple garden bed and looking thoughtfully at a patch of dirt with a tiny hopeful sprout.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 2 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Underground Work&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 1 · Quiet beginnings&lt;/div&gt;
          &lt;h2&gt;Potatoes Are Weirdly Encouraging&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Potatoes are one of the most forgiving beginner crops, mostly because they begin with a potato.&lt;/p&gt;
            &lt;p&gt;This feels reassuring.&lt;/p&gt;
            &lt;p&gt;Unlike tomatoes, which arrive with drama and opinions, potatoes are quiet.&lt;/p&gt;
            &lt;p&gt;You place them in the ground, cover them with soil, and then… nothing obvious happens for a while.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;They are not being lazy. They are working underground.&lt;/strong&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/miraclepotatoes.png&quot; alt=&quot;Whimsical miracle potatoes growing with hopeful garden energy.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 3 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Potato Personality Check&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Interaction · Potato emotional readiness&lt;/div&gt;
          &lt;h2&gt;What do potatoes teach us?&lt;/h2&gt;
          &lt;p class=&quot;subtitle&quot;&gt;Before we get practical, choose the statement that you think might describe you?&lt;/p&gt;
          &lt;div class=&quot;choice-grid&quot;&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showReadinessFeedback('A')&quot;&gt;A. I enjoy seeing constant visible progress.&lt;/button&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showReadinessFeedback('B')&quot;&gt;B. I will probably dig them up early just to check.&lt;/button&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showReadinessFeedback('C')&quot;&gt;C. I am willing to trust that something might be happening underground.&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;feedback-box&quot; id=&quot;readinessFeedback&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 4 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Seed Potatoes&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 2 · Seed potatoes&lt;/div&gt;
          &lt;h2&gt;Start With Seed Potatoes&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;To grow potatoes, you usually start with &lt;strong&gt;seed potatoes&lt;/strong&gt;.&lt;/p&gt;
            &lt;p&gt;These are not seeds in the tiny packet sense. They are small potatoes or potato pieces that have little growing points called &lt;strong&gt;eyes&lt;/strong&gt;.&lt;/p&gt;
            &lt;p&gt;Each eye can become a new potato plant.&lt;/p&gt;
            &lt;p&gt;This is both practical and mildly unsettling.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/seedpotato.png&quot; alt=&quot;Cheerful cartoon seed potato with little eyes and sprouts sitting on a gardening table.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 5 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Cutting Seed Potatoes&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 3 · Potato preparation&lt;/div&gt;
          &lt;h2&gt;A Potato That Knows How to Be a Potato&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;You can plant small seed potatoes whole.&lt;/p&gt;
            &lt;p&gt;Larger seed potatoes can be cut into pieces, as long as each piece has at least one or two eyes.&lt;/p&gt;
            &lt;p&gt;If you cut seed potatoes, let the pieces sit for a day or two before planting so the cut sides can dry and callous over.&lt;/p&gt;
            &lt;p&gt;This helps reduce the chance of rotting.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 6 --&gt;
    &lt;section class=&quot;scene transition-match&quot; data-title=&quot;Underground Transition&quot; style=&quot;--scene-bg:linear-gradient(180deg,#ffe7ad 0%,#b09b72 48%,#5b3f2f 100%);&quot;&gt;
      &lt;div class=&quot;vine-wave&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;scene-card full&quot; style=&quot;background:rgba(39,63,45,.5);border-color:rgba(255,255,255,.28);&quot;&gt;
        &lt;div class=&quot;season-card&quot;&gt;
          &lt;div class=&quot;eyebrow&quot; style=&quot;background:rgba(255,247,234,.16);color:#ffe7ad;border-color:rgba(255,255,255,.24);margin-inline:auto;&quot;&gt;Seasonal Transition&lt;/div&gt;
          &lt;h2&gt;Something Is Happening Underground&lt;/h2&gt;
          &lt;p&gt;Probably&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 7 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Growing Options&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 4 · Loose soil is the love language&lt;/div&gt;
          &lt;h2&gt;Potatoes Need Room to Become Potatoes&lt;/h2&gt;
          &lt;p class=&quot;subtitle&quot;&gt;Potatoes grow best in loose, well-draining soil or another flexible growing space.&lt;/p&gt;
          &lt;div class=&quot;learning-grid&quot;&gt;
            &lt;div class=&quot;learn-card&quot;&gt;&lt;div class=&quot;icon&quot;&gt;🌱&lt;/div&gt;&lt;h3&gt;Loose Soil&lt;/h3&gt;&lt;p&gt;Gives potatoes room to expand underground.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;learn-card&quot;&gt;&lt;div class=&quot;icon&quot;&gt;🧺&lt;/div&gt;&lt;h3&gt;Grow Bags&lt;/h3&gt;&lt;p&gt;A flexible option for small spaces.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;learn-card&quot;&gt;&lt;div class=&quot;icon&quot;&gt;🌾&lt;/div&gt;&lt;h3&gt;Straw Bales&lt;/h3&gt;&lt;p&gt;Create a light, airy place for potatoes to grow.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;learn-card&quot;&gt;&lt;div class=&quot;icon&quot;&gt;🟫&lt;/div&gt;&lt;h3&gt;Raised Beds&lt;/h3&gt;&lt;p&gt;Helpful when your soil is compacted or dramatic.&lt;/p&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 8 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Planting&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 5 · Planting with faith&lt;/div&gt;
          &lt;h2&gt;Plant Them Like You Believe Something Will Happen&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Plant seed potatoes about 4 inches deep with the eyes facing up.&lt;/p&gt;
            &lt;p&gt;Space them about 10–12 inches apart.&lt;/p&gt;
            &lt;p&gt;Cover them completely with soil.&lt;/p&gt;
            &lt;p&gt;Then you wait.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;Sometimes you have to bury hope before you see growth.&lt;/strong&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/buriedpotato.png&quot; alt=&quot;Hands planting potato pieces into soft soil with a warm buried hope feeling.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 9 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Planting Check&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Interaction · Planting check&lt;/div&gt;
          &lt;h2&gt;How deep should you usually plant seed potatoes?&lt;/h2&gt;
          &lt;div class=&quot;choice-grid two&quot;&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showPlantingFeedback('A')&quot;&gt;A. Right on top of the soil&lt;/button&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showPlantingFeedback('B')&quot;&gt;B. About 1 inch deep&lt;/button&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showPlantingFeedback('C')&quot;&gt;C. About 4 inches deep&lt;/button&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showPlantingFeedback('D')&quot;&gt;D. As deep as emotionally possible&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;feedback-box&quot; id=&quot;plantingFeedback&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 10 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Watering&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 6 · Water, but do not drown the hope&lt;/div&gt;
          &lt;h2&gt;The Soil Has More Accurate Information Than Your Feelings&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Potatoes like consistent moisture, especially once the plants are growing and forming tubers underground.&lt;/p&gt;
            &lt;p&gt;They do not want to dry out completely for long periods.&lt;/p&gt;
            &lt;p&gt;They also do not want to sit in soggy soil like they are trapped in a swamp of regret.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 11 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Hilling&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 7 · Hilling potatoes&lt;/div&gt;
          &lt;h2&gt;Tuck Them In, Gently&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Once potato plants are about 6–8 inches tall, you can begin &lt;strong&gt;hilling&lt;/strong&gt; them.&lt;/p&gt;
            &lt;p&gt;Hilling means pulling soil, compost, straw, or mulch up around the base of the plant while leaving the top leaves exposed.&lt;/p&gt;
            &lt;p&gt;This gives the plant more covered space to form potatoes and helps keep developing potatoes from being exposed to sunlight.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;You are not sculpting a mountain range. You are just covering the base.&lt;/strong&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/tuckedpotato.png&quot; alt=&quot;Cozy potato plant being tucked in with soil or mulch around the base.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 12 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Harvest Timing&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 8 · Harvest timing&lt;/div&gt;
          &lt;h2&gt;The Plant May Look Chaotic, Then Tired&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Potato plants grow leafy tops above ground.&lt;/p&gt;
            &lt;p&gt;At first, this can feel exciting. You may look at the leaves and think, “Look at my potato empire.”&lt;/p&gt;
            &lt;p&gt;Later in the season, the plants may start to yellow, flop, or die back.&lt;/p&gt;
            &lt;p&gt;This can feel alarming, but it is often a sign that the potatoes are nearing harvest.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;Not everything that looks tired is failing. Sometimes it is completing its work.&lt;/strong&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/hiddenpotatoes.png&quot; alt=&quot;Peaceful garden bed at golden hour with potatoes hidden underground and leafy plants above.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 13 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Harvest&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 9 · Treasure hunting&lt;/div&gt;
          &lt;h2&gt;The Dirt Hands You Dinner&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;&lt;strong&gt;New potatoes&lt;/strong&gt; are small, tender potatoes harvested while the plant is still alive and green.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;Storage potatoes&lt;/strong&gt; are harvested after the plant has died back. These potatoes are usually larger and better for storing.&lt;/p&gt;
            &lt;p&gt;Dig gently. There will be potatoes where you expected them.&lt;/p&gt;
            &lt;p&gt;There may also be potatoes in weird places.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;Potatoes enjoy mystery.&lt;/strong&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/treasurepotato.png&quot; alt=&quot;Gardener carefully harvesting potatoes from the soil like hidden treasure.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 14 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Quiet Gardens&quot; style=&quot;--scene-bg:linear-gradient(180deg,#f5c47e 0%,#a1764e 45%,#3d5536 100%);&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 10 · Quiet Potatoes&lt;/div&gt;
          &lt;h2&gt;Quiet Gardens Still Count&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Potatoes are not flashy.&lt;/p&gt;
            &lt;p&gt;They do not climb dramatically. They do not produce bright fruit above ground. They do not demand constant attention.&lt;/p&gt;
            &lt;p&gt;They grow quietly in the dark.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;Sometimes you plant the potato, cover it with dirt, water it, and trust that hope is doing something underground.&lt;/strong&gt;&lt;/p&gt;
            &lt;p&gt;That counts.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/quietpotatoes.png&quot; alt=&quot;Quiet potato garden with a peaceful, hopeful feeling.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;


    &lt;!-- Scene 15 --&gt;
    &lt;section class=&quot;scene end-match&quot; data-title=&quot;End&quot; style=&quot;--scene-bg:linear-gradient(180deg,#f5c47e 0%,#a1764e 45%,#3d5536 100%);&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;end-card&quot;&gt;
          &lt;div class=&quot;eyebrow&quot; style=&quot;margin-inline:auto;&quot;&gt;End of Episode 5&lt;/div&gt;
          &lt;h2&gt;Potatoes and Buried Hope&lt;/h2&gt;
          &lt;p class=&quot;subtitle&quot; style=&quot;margin-inline:auto;&quot;&gt;The hidden growth still counts.&lt;/p&gt;
          &lt;div class=&quot;next-episode&quot;&gt;
            &lt;strong&gt;Next Episode&lt;/strong&gt;
            &lt;span&gt;The Butternut Situation&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;nav class=&quot;nav&quot; aria-label=&quot;Lesson navigation&quot;&gt;
      &lt;button class=&quot;btn secondary&quot; id=&quot;backBtn&quot; onclick=&quot;prevScene()&quot;&gt;Back&lt;/button&gt;
      &lt;button class=&quot;btn primary&quot; id=&quot;nextBtn&quot; onclick=&quot;nextScene()&quot;&gt;Next&lt;/button&gt;
    &lt;/nav&gt;
  &lt;/main&gt;

  &lt;script&gt;
    const scenes = Array.from(document.querySelectorAll('.scene'));
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    let current = 0;

    function updateScene(){
      scenes.forEach((scene, i) =&gt; scene.classList.toggle('active', i === current));
      const total = scenes.length;
      progressBar.style.width = ((current + 1) / total * 100) + '%';
      progressLabel.textContent = `${current + 1} / ${total}`;
      backBtn.disabled = current === 0;
      nextBtn.textContent = current === total - 1 ? 'Episode 6' : 'Next';
      window.scrollTo(0,0);
    }

    function nextScene(){
      if(current &lt; scenes.length - 1){
        current++;
        updateScene();
      } else {
        parent.postMessage({type:'garden-go', target:'episode-6'}, '*');
      }
    }

    function prevScene(){
      if(current &gt; 0){
        current--;
        updateScene();
      }
    }

    function showReadinessFeedback(choice){
      const box = document.getElementById('readinessFeedback');
      const responses = {
        A: {
          title:'Potatoes may gently challenge this',
          text:'They are very committed to the mystery portion of the gardening process. Visible progress arrives eventually, but potatoes do not rush their reveal.'
        },
        B: {
          title:'Understandable',
          text:'Try not to. Potatoes need time, privacy, and fewer surprise inspections.'
        },
        C: {
          title:'Excellent',
          text:'This is the emotional posture potatoes require: a little trust, a little water, and fewer surprise inspections.'
        }
      };
      box.style.display = 'block';
      box.innerHTML = `&lt;h3&gt;${responses[choice].title}&lt;/h3&gt;&lt;p&gt;${responses[choice].text}&lt;/p&gt;`;

&lt;body&gt;
  &lt;main class=&quot;course-shell&quot; aria-live=&quot;polite&quot;&gt;

    &lt;!-- Scene 1 --&gt;
    &lt;section class=&quot;scene active&quot; data-title=&quot;Opening&quot; style=&quot;--scene-bg:linear-gradient(180deg,#ffe0a3 0%,#d8c18b 45%,#789363 100%);&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Episode 6 · Cozy Fall Ambitions&lt;/div&gt;
          &lt;h1&gt;The Butternut Situation&lt;/h1&gt;
          &lt;p class=&quot;subtitle&quot;&gt;Manage sprawling squash vines, prevent garden takeovers, and learn how to cure and store butternut squash for cozy fall meals.&lt;/p&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Butternut squash begins innocently.&lt;/p&gt;
            &lt;p&gt;A few leaves. A small vine. A sweet little promise of soup.&lt;/p&gt;
            &lt;p&gt;Then suddenly the plant appears to have opinions about property lines.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/bsseedling.png&quot; alt=&quot;A woman looking at a small butternut squash seedling with a suspiciously long vine starting to creep away.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 2 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Give It Space&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 1 · Choose the spot carefully&lt;/div&gt;
          &lt;h2&gt;Do Not Tuck This into a Tiny Corner&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Butternut squash likes full sun, warm soil, and a suspicious amount of room.&lt;/p&gt;
            &lt;p&gt;This is not the plant to squeeze politely between basil and your better judgment.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;Plant it somewhere it can be dramatic without ruining everyone else’s summer.&lt;/strong&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/bsgardenbed.png&quot; alt=&quot;A sunny garden bed with a little butternut squash plant and a humorous amount of empty space around it.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

            &lt;p&gt;At some point, the vine will begin moving toward nearby plants like it has a meeting scheduled there.&lt;/p&gt;
            &lt;p&gt;This is normal. It may feel personal. It is not.&lt;/p&gt;
            &lt;p&gt;Guide the vine while it is still flexible, and try not to enter a boundary dispute with a vegetable.&lt;/p&gt;

        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/squashvine.png&quot; alt=&quot;A squash vine dramatically heading toward neighboring pepper and tomato plants while a gardener gently redirects it.&quot;&gt;
        &lt;/div&gt;

          &lt;h2&gt;Your butternut squash vine is heading directly toward your pepper plants. What should you do?&lt;/h2&gt;
