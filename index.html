        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 3 · Male flowers, female flowers, and mild confusion&lt;/div&gt;
          &lt;h2&gt;Not Every Flower Becomes Squash&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Male flowers usually appear first, which can feel emotionally misleading.&lt;/p&gt;
            &lt;p&gt;Female flowers have a small swollen shape at the base that looks like a tiny baby squash.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;Male flowers do not become squash. Female flowers can, if pollinated.&lt;/strong&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/maleandfemaleflowers.png&quot; alt=&quot;Two squash flowers side by side: one male flower and one female flower with a tiny squash at the base.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 6 --&gt;
    &lt;section class=&quot;scene pollination-scene&quot; data-title=&quot;Pollination&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 4 · Pollination requires visitors&lt;/div&gt;
          &lt;h2&gt;Flowers Are Good. Bees Are Better.&lt;/h2&gt;
          &lt;p class=&quot;subtitle&quot;&gt;Squash fruit depends on pollination, which means the flowers need a little outside help.&lt;/p&gt;
          &lt;div class=&quot;learning-grid&quot;&gt;
            &lt;div class=&quot;learn-card&quot;&gt;&lt;div class=&quot;icon&quot;&gt;🐝&lt;/div&gt;&lt;h3&gt;Pollinators&lt;/h3&gt;&lt;p&gt;Bees help move pollen from male flowers to female flowers.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;learn-card&quot;&gt;&lt;div class=&quot;icon&quot;&gt;🌼&lt;/div&gt;&lt;h3&gt;Nearby flowers&lt;/h3&gt;&lt;p&gt;Planting flowers nearby can make the garden more inviting.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;learn-card&quot;&gt;&lt;div class=&quot;icon&quot;&gt;🚫&lt;/div&gt;&lt;h3&gt;Less spraying&lt;/h3&gt;&lt;p&gt;Avoid pesticide use when pollinators are active if possible.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;learn-card&quot;&gt;&lt;div class=&quot;icon&quot;&gt;⏳&lt;/div&gt;&lt;h3&gt;Timing&lt;/h3&gt;&lt;p&gt;Sometimes the plant is simply early and still rehearsing.&lt;/p&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 7 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;First Squash&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 5 · The first butternut appears&lt;/div&gt;
          &lt;h2&gt;Tiny Squash, Enormous Feelings&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;The first little butternut hidden under a leaf feels like a miracle.&lt;/p&gt;
            &lt;p&gt;Suddenly the vine chaos has a purpose.&lt;/p&gt;
            &lt;p&gt;Try not to poke it constantly. The plant is already doing a lot.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/tinybutternut.png&quot; alt=&quot;A tiny baby butternut squash tucked under a large green leaf.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 8 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Managing The Takeover&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 6 · Managing the takeover&lt;/div&gt;
          &lt;h2&gt;You Do Not Need to Surrender the Path&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;By this point the vine may be making large, confident choices.&lt;/p&gt;
            &lt;p&gt;Gently redirect vines away from walking paths and smaller plants, and place developing squash on straw, mulch, cardboard, or a board if the ground is very wet.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;You do not need to micromanage every inch, but you are allowed to retain basic access to your own garden.&lt;/strong&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/sprawlingbutternut.png&quot; alt=&quot;A sprawling squash vine across the garden path with a gardener calmly redirecting it.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 9 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Harvest Timing&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 7 · When is butternut squash ready?&lt;/div&gt;
          &lt;h2&gt;Tan, Tough, and Finally Serious&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;A mature butternut squash usually has a deep tan color, a hard rind, and a dry, corky stem.&lt;/p&gt;
            &lt;p&gt;If the rind is still soft or the stem still looks green and juicy, the squash probably needs more time.&lt;/p&gt;
            &lt;p&gt;This is where gardeners must resist premature celebration.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/maturebutternut.png&quot; alt=&quot;Mature tan butternut squash on the vine with dry stems.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 10 --&gt;
    &lt;section class=&quot;scene transition-match&quot; data-title=&quot;Harvest Before Frost&quot; style=&quot;--scene-bg:linear-gradient(180deg,#ffd27e 0%,#b9874a 46%,#55683d 100%);&quot;&gt;
      &lt;div class=&quot;vine-wave&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;scene-card full&quot; style=&quot;background:rgba(39,63,45,.5);border-color:rgba(255,255,255,.28);&quot;&gt;
        &lt;div class=&quot;season-card&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 8 · Harvest before frost&lt;/div&gt;
          &lt;h2&gt;Do Not Let The First Hard Frost Win&lt;/h2&gt;
          &lt;p&gt;Harvest butternut squash before a hard frost, cut it with a couple inches of stem attached, and remember that the stem is not a handle.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 11 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Curing&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 9 · Curing makes it better&lt;/div&gt;
          &lt;h2&gt;Do Not Skip the Warm-Up Period&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;After harvest, let the squash cure in a warm, dry, well-ventilated place for about 1–2 weeks.&lt;/p&gt;
            &lt;p&gt;This helps the skin harden and improves storage life.&lt;/p&gt;
            &lt;p&gt;Do not pile them in a damp corner and call that a system.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/harvestedbutternut.png&quot; alt=&quot;Harvested butternut squash curing on a warm porch or table.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 12 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Storage&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 10 · Store for cozy fall meals&lt;/div&gt;
          &lt;h2&gt;This Is Where the Soup Future Begins&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Once cured, store butternut squash in a cool, dry, dark place with good airflow.&lt;/p&gt;
            &lt;p&gt;Check it occasionally and use any squash with bruises, soft spots, or broken stems first.&lt;/p&gt;
            &lt;p&gt;Properly stored squash can last for months, which feels deeply satisfying when sweater weather arrives.&lt;/p&gt;

        &lt;/div&gt;

          &lt;div class=&quot;eyebrow&quot;&gt;Part 11 · Quiet abundance&lt;/div&gt;
          &lt;h2&gt;Some Plants Are Generous In The Long Run&lt;/h2&gt;
          &lt;p class=&quot;subtitle&quot;&gt;Butternut squash is a lesson in delayed gratification, leafy ambition, and eventual comfort food.&lt;/p&gt;

            &lt;p&gt;It takes space.&lt;/p&gt;
            &lt;p&gt;It takes time.&lt;/p&gt;

            &lt;p&gt;But then Fall comes, the vines fade, and the squash remain.&lt;/p&gt;
            &lt;p&gt;Suddenly the plant that seemed like too much becomes exactly enough.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;

  &lt;script&gt;
    const scenes = Array.from(document.querySelectorAll('.scene'));
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    let current = 0;

    function updateScene(){
      scenes.forEach((scene, i) =&gt; scene.classList.toggle('active', i === current));
      const total = scenes.length;
      progressBar.style.width = ((current + 1) / total * 100) + '%';
      progressLabel.textContent = `${current + 1} / ${total}`;
      backBtn.disabled = current === 0;
      nextBtn.textContent = current === total - 1 ? 'Episode 7' : 'Next';
      window.scrollTo(0,0);
    }

    function nextScene(){
      if(current &lt; scenes.length - 1){
        current++;
        updateScene();
      } else {
        parent.postMessage({type:'garden-go', target:'episode-7'}, '*');
      }
    }

    function prevScene(){
      if(current &gt; 0){
        current--;
        updateScene();
      }
    }

    function showVineFeedback(choice){
      const box = document.getElementById('vineFeedback');
      const responses = {
        A: {
          title:'Bold, but not ideal',
          text:'Peppers usually prefer sunlight, airflow, and not being quietly absorbed into a squash empire.'
        },
        B: {
          title:'Understandable, but unnecessary',
          text:'Most squash situations do not require panic pruning. Start with gentle redirection and fewer dramatic decisions.'
        },
        C: {
          title:'Exactly',
          text:'Guide the vine while it is still flexible. Calm redirection solves most butternut boundary issues.'
        }
      };
      box.style.display = 'block';
      box.innerHTML = `&lt;h3&gt;${responses[choice].title}&lt;/h3&gt;&lt;p&gt;${responses[choice].text}&lt;/p&gt;`;
    }

    document.addEventListener('keydown', (e) =&gt; {
      if(e.key === 'ArrowRight') nextScene();
      if(e.key === 'ArrowLeft') prevScene();
    });

    updateScene();
  &lt;/script&gt;

      text-align:left;
      cursor:pointer;
      font-size:16px;
      line-height:1.35;
      color:#3b3029;
      transition:.22s transform ease,.22s background ease,.22s box-shadow ease;
      font-family:Inter,ui-sans-serif,system-ui,sans-serif;
      font-weight:800;
    }
    .choice:hover{
      transform:translateY(-3px);
      background:#fff1cf;
      box-shadow:var(--soft-shadow);
    }
    .feedback-box{
      margin-top:16px;
      border-radius:24px;
      background:linear-gradient(145deg,#4f6f52,#273f2d);
      color:#fff7ea;
      padding:18px 20px;
      font-family:Inter,ui-sans-serif,system-ui,sans-serif;
      display:none;
      animation:sceneIn .35s ease both;
    }
    .feedback-box h3{margin:0 0 8px;color:#ffe7ad;font-size:22px}
    .feedback-box p{margin:0;line-height:1.45;font-size:16px}

    .season-card{
      text-align:center;
      padding:clamp(28px,5vw,54px);
      color:#fff7ea;
      text-shadow:0 4px 24px rgba(0,0,0,.28);
    }
    .season-card h2{
      color:#fff7ea;
      font-size:clamp(44px,8vw,92px);
      margin-bottom:18px;
    }
    .season-card p{
      font-size:clamp(19px,2.5vw,31px);
      margin:0;
    }

    .end-card{
      text-align:center;
      padding:clamp(32px,5vw,62px);
    }
    .end-card h2{font-size:clamp(42px,7vw,92px)}
    .next-episode{
      margin:24px auto 0;
      width:min(560px,100%);
      background:linear-gradient(145deg,#fffaf1,#f4e6cc);
      border:1px solid rgba(79,111,82,.18);
      border-radius:28px;
      padding:24px;
      box-shadow:var(--soft-shadow);
      font-family:Inter,ui-sans-serif,system-ui,sans-serif;
    }
    .next-episode strong{
      display:block;
      color:var(--water-dark);
      letter-spacing:.1em;
      text-transform:uppercase;
      font-size:12px;
      margin-bottom:8px;
    }
    .next-episode span{
      font-family:Georgia,'Times New Roman',serif;
      display:block;
      color:var(--moss);
      font-size:34px;
      font-weight:900;
      letter-spacing:-.03em;
    }

    .end-match .scene-card.full{
      width:min(980px,94vw) !important;
      height:auto !important;
      min-height:auto !important;
      max-height:calc(100vh - 150px) !important;
      overflow:auto !important;
      grid-template-columns:1fr !important;
    }

    /* Mobile */
    @media(max-width:960px){
      body{overflow:hidden}
      .course-shell{height:100vh;min-height:100vh;overflow:hidden}
      .scene{position:absolute;min-height:0;height:100vh;padding:52px 12px 74px}
      .scene-card{
        grid-template-columns:1fr;
        width:96vw;
        height:calc(100vh - 132px);
        max-height:calc(100vh - 132px);
        overflow:hidden;
        border-radius:26px;
      }
      .scene-card.full{height:calc(100vh - 132px);max-height:calc(100vh - 132px)}
      .visual-side{height:38%;max-height:250px;order:-1}
      .text-side{height:auto;flex:1;padding:18px;overflow:auto;justify-content:flex-start}
      h1{font-size:clamp(36px,11vw,64px)}
      h2{font-size:clamp(30px,9vw,54px)}
      .subtitle{font-size:clamp(16px,4.6vw,22px);margin-bottom:14px}
      .copy{font-size:clamp(15px,4.1vw,20px)}
      .copy p{margin-bottom:9px}
      .learning-grid{grid-template-columns:1fr;gap:8px}
      .learn-card{min-height:auto;padding:12px}
      .learn-card .icon{font-size:28px;margin-bottom:6px}
      .choice-grid{grid-template-columns:1fr;gap:9px}
      .choice{font-size:14px;padding:12px}
      .progress-wrap{width:calc(100vw - 24px)}
      .nav{width:calc(100vw - 24px);gap:8px}
      .btn{padding:12px 15px;font-size:13px}
      .end-match .scene-card.full{
        width:96vw !important;
        height:calc(100vh - 132px) !important;
        max-height:calc(100vh - 132px) !important;
        overflow:auto !important;
        border-radius:26px !important;
      }
    }

    @media(max-width:560px){
      .scene{padding:48px 8px 70px}
      .scene-card{width:calc(100vw - 16px);height:calc(100vh - 118px);max-height:calc(100vh - 118px);border-radius:22px}
      .scene-card.full{height:calc(100vh - 118px);max-height:calc(100vh - 118px)}
      .visual-side{height:32%;max-height:190px}
      .text-side{padding:15px}
      .eyebrow{font-size:9.5px;padding:7px 10px;margin-bottom:10px}
      h1{font-size:clamp(32px,12vw,50px);margin-bottom:12px}
      h2{font-size:clamp(27px,10vw,44px);margin-bottom:12px}
      .subtitle{font-size:15px;line-height:1.25}
      .copy{font-size:14.5px;line-height:1.32}
      .feedback-box h3{font-size:17px}
      .feedback-box p{font-size:13px}
      .end-card{padding:24px 18px}
      .next-episode{padding:18px}
      .next-episode span{font-size:26px}
      .end-match .scene-card.full{
        width:calc(100vw - 16px) !important;
        height:calc(100vh - 118px) !important;
        max-height:calc(100vh - 118px) !important;
        border-radius:22px !important;
      }
    }
  &lt;/style&gt;

&lt;body&gt;
  &lt;main class=&quot;course-shell&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;progress-wrap&quot;&gt;
      &lt;div class=&quot;progress-track&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;progress-bar&quot; id=&quot;progressBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;progress-label&quot; id=&quot;progressLabel&quot;&gt;1 / 15&lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- Scene 1 --&gt;
    &lt;section class=&quot;scene active&quot; data-title=&quot;Opening&quot; style=&quot;--scene-bg:linear-gradient(180deg,#d9e8f2 0%,#d8c18b 45%,#789363 100%);&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Episode 7 · Low-Drama Garden Care&lt;/div&gt;
          &lt;h1&gt;The Lazy Watering Method&lt;/h1&gt;
          &lt;p class=&quot;subtitle&quot;&gt;Build watering and mulching habits that keep tomatoes, peppers, zucchini, potatoes, and butternut alive without turning gardening into a full-time responsibility.&lt;/p&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Watering feels like it should be simple.&lt;/p&gt;
            &lt;p&gt;Plants need water. You own a hose. Surely this relationship can be managed.&lt;/p&gt;
            &lt;p&gt;And yet somehow the hose acquires emotional weight.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/overwhelmedwatering.png&quot; alt=&quot;A gardener holding a hose while looking overwhelmed, surrounded by tomatoes, peppers, zucchini, potatoes, and butternut squash.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 2 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Soil Check&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 1 · The soil knows more than your anxiety&lt;/div&gt;
          &lt;h2&gt;Check the Soil Before the Spiral&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;The best way to know whether a plant needs water is to check the soil.&lt;/p&gt;
            &lt;p&gt;Stick your finger about 1–2 inches into the soil near the plant.&lt;/p&gt;
            &lt;p&gt;If it feels moist, leave it alone. If it feels dry, water. If it feels like soup, please step away from the hose.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/fingercheck.png&quot; alt=&quot;A finger checking soil moisture near a plant with a calm garden background.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 3 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Soil Check Interaction&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Interaction · Soil check&lt;/div&gt;
          &lt;h2&gt;You stick your finger into the soil near your tomato plant. It feels moist about an inch down. What should you do?&lt;/h2&gt;
          &lt;div class=&quot;choice-grid&quot;&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showSoilFeedback('A')&quot;&gt;A. Water anyway because you are already holding the hose.&lt;/button&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showSoilFeedback('B')&quot;&gt;B. Leave it alone and check again later.&lt;/button&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showSoilFeedback('C')&quot;&gt;C. Apologize to the tomato for disturbing its privacy.&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;feedback-box&quot; id=&quot;soilFeedback&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 4 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Deep Watering&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 2 · Deep watering beats little sprinkles&lt;/div&gt;
          &lt;h2&gt;A Light Sprinkle Is Not a Strategy&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Plants usually do better with deeper watering less often than with tiny daily sprinkles.&lt;/p&gt;
            &lt;p&gt;Little surface splashes mostly wet the top layer of soil and encourage shallow roots.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;You are not misting a spa cucumber. You are trying to reach the root zone.&lt;/strong&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/soaking.png&quot; alt=&quot;Water soaking deeply into soil with roots reaching down, contrasted with tiny sprinkles only wetting the surface.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 5 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Water The Base&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 3 · Water the roots, not the drama&lt;/div&gt;
          &lt;h2&gt;Water the Dirt&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Most vegetables prefer water at the base of the plant instead of sprayed all over the leaves.&lt;/p&gt;
            &lt;p&gt;This helps the roots get what they need and reduces the chance of leaves sitting around wet and encouraging disease.&lt;/p&gt;
            &lt;p&gt;Tomatoes especially appreciate fewer fungal invitations.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/waterbase.png&quot; alt=&quot;A watering can or hose aimed at the base of a plant instead of leaves.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 6 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Mulch&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 4 · Mulch is lazy gardening infrastructure&lt;/div&gt;
          &lt;h2&gt;Mulch Does a Lot of the Emotional Labor&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Mulch helps soil hold moisture, keeps roots cooler, reduces weeds, and makes the garden look more organized than it may actually be.&lt;/p&gt;
            &lt;p&gt;Straw, shredded leaves, compost, and untreated grass clippings can all help.&lt;/p&gt;
            &lt;p&gt;Keep mulch a little away from stems. You are tucking in the soil, not smothering the plant.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/mulchedbed.png&quot; alt=&quot;A cozy mulched garden bed with vegetables tucked in neatly.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 7 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Watering Rhythm&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 5 · The lazy watering rhythm&lt;/div&gt;
          &lt;h2&gt;Build a Rhythm, Not a Guilt Ritual&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;A simple watering rhythm is based on observation, not panic.&lt;/p&gt;
            &lt;p&gt;Check the soil in the morning, water deeply when needed, use mulch to slow evaporation, and skip watering if rain already handled it.&lt;/p&gt;
            &lt;p&gt;This is not a rigid schedule. It is a relationship with the garden that does not require constant texting.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/gardencheck.png&quot; alt=&quot;A simple morning garden check with sun, soil, mulch, and a hose nearby.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 8 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Watering Rhythm Interaction&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Interaction · Watering rhythm check&lt;/div&gt;
          &lt;h2&gt;It rained yesterday, and today the soil still feels damp near your zucchini plant. What should you do?&lt;/h2&gt;
          &lt;div class=&quot;choice-grid&quot;&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showRhythmFeedback('A')&quot;&gt;A. Skip watering and check again later.&lt;/button&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showRhythmFeedback('B')&quot;&gt;B. Water anyway because routines matter.&lt;/button&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showRhythmFeedback('C')&quot;&gt;C. Tell the zucchini it is on its own now.&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;feedback-box&quot; id=&quot;rhythmFeedback&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 9 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Tomatoes&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 6 · Tomatoes want consistency&lt;/div&gt;
          &lt;h2&gt;Tomatoes Do Not Love a Reconciliation Flood&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Tomatoes prefer reasonably consistent moisture, especially when fruit is forming.&lt;/p&gt;
            &lt;p&gt;Drying them out completely and then flooding them can lead to cracked fruit and blossom end rot.&lt;/p&gt;
            &lt;p&gt;Mulch, deep watering, and checking the soil help keep the tomato drama manageable.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/tomatomulch.png&quot; alt=&quot;Tomato plant with fruit and mulch around the base.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 10 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Peppers&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 7 · Peppers prefer calm consistency&lt;/div&gt;
          &lt;h2&gt;Peppers Prefer Fewer Emotional Swings&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Peppers like steady moisture, warmth, and a generally calm environment.&lt;/p&gt;
            &lt;p&gt;Letting them get too dry can lead to flower drop, but soggy soil can make them unhappy in a different direction.&lt;/p&gt;
            &lt;p&gt;Do not confuse slow pepper growth with an immediate hydration emergency.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/peppersun.png&quot; alt=&quot;Pepper plant in warm sun with lightly moist soil.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 11 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Zucchini&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 8 · Zucchini is thirsty and unsubtle&lt;/div&gt;
          &lt;h2&gt;Wilt First, Questions Later&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Zucchini has large leaves and can wilt dramatically in hot weather.&lt;/p&gt;
            &lt;p&gt;This does not always mean crisis. Check the soil before reacting.&lt;/p&gt;
            &lt;p&gt;If the soil is dry, water deeply. If the soil is moist and the plant perks up later, the zucchini was probably just performing.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/wiltingzucchini.png&quot; alt=&quot;Dramatic zucchini plant wilting slightly in heat, with the gardener checking soil before panicking.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 12 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Potatoes&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 9 · Potatoes need moisture underground&lt;/div&gt;
          &lt;h2&gt;The Hidden Potato Operation Needs Support&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Potatoes need consistent moisture, especially while tubers are forming underground.&lt;/p&gt;
            &lt;p&gt;If the soil dries out too much, the potatoes may not size up well. If it stays soggy, rot becomes more likely.&lt;/p&gt;
            &lt;p&gt;Loose soil, good drainage, and mulch make this whole invisible operation much easier to support.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/potatocutaway.png&quot; alt=&quot;Potato plants with an underground cutaway showing moist soil around forming potatoes.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 13 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Butternut&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 10 · Butternut squash has a big thirsty system&lt;/div&gt;
          &lt;h2&gt;Large Vines, Large Leaves, Large Opinions&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Butternut squash needs deep watering during dry stretches, especially once fruit is developing.&lt;/p&gt;
            &lt;p&gt;Its big leaves may wilt in hot afternoons and recover later, so check the soil before assuming collapse.&lt;/p&gt;
            &lt;p&gt;Mulch helps keep the soil cooler and reduces how often you need to intervene.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/butternutmulch.png&quot; alt=&quot;Butternut squash vine with large leaves, fruit forming, and mulch around the base.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 14 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Lazy Method&quot; style=&quot;--scene-bg:linear-gradient(180deg,#dfe8ce 0%,#c4a26c 45%,#3d5536 100%);&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 11 · The lazy method is actually paying attention&lt;/div&gt;
          &lt;h2&gt;The Hose Is Not a Moral Test&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;The lazy watering method is simple: check the soil, water deeply when needed, aim for the roots, use mulch, and adjust after rain.&lt;/p&gt;
            &lt;p&gt;Do not panic because one leaf looked theatrical at 3 p.m.&lt;/p&gt;
            &lt;p&gt;&lt;strong&gt;Lazy gardening is not neglect. It is strategic effort.&lt;/strong&gt;&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/peacefulgardenmulch.png&quot; alt=&quot;Peaceful garden at golden hour with mulch, hose, watering can, and thriving plants.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 15 --&gt;
    &lt;section class=&quot;scene end-match&quot; data-title=&quot;End&quot; style=&quot;--scene-bg:linear-gradient(180deg,#cfe0ea 0%,#a1764e 45%,#3d5536 100%);&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;end-card&quot;&gt;
          &lt;div class=&quot;eyebrow&quot; style=&quot;margin-inline:auto;&quot;&gt;End of Episode 7&lt;/div&gt;
          &lt;h2&gt;The Lazy Watering Method&lt;/h2&gt;
          &lt;p class=&quot;subtitle&quot; style=&quot;margin-inline:auto;&quot;&gt;Water the roots, trust the soil, and let mulch do some of the work.&lt;/p&gt;
          &lt;div class=&quot;next-episode&quot;&gt;
            &lt;strong&gt;Next Episode&lt;/strong&gt;
            &lt;span&gt;Harvest Redemption&lt;/span&gt;
          &lt;/div&gt;

  &lt;script&gt;
    const scenes = Array.from(document.querySelectorAll('.scene'));
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    let current = 0;

    function updateScene(){
      scenes.forEach((scene, i) =&gt; scene.classList.toggle('active', i === current));
      const total = scenes.length;
      progressBar.style.width = ((current + 1) / total * 100) + '%';
      progressLabel.textContent = `${current + 1} / ${total}`;
      backBtn.disabled = current === 0;
      nextBtn.textContent = current === total - 1 ? 'Episode 8' : 'Next';
      window.scrollTo(0,0);
    }

    function nextScene(){
      if(current &lt; scenes.length - 1){
        current++;
        updateScene();
      } else {
        parent.postMessage({type:'garden-go', target:'episode-8'}, '*');
      }
    }

    function prevScene(){
      if(current &gt; 0){
        current--;
        updateScene();
      }
    }

    function showSoilFeedback(choice){
      const box = document.getElementById('soilFeedback');
      const responses = {
        A: {
          title:'Understandable, but unnecessary',
          text:'Moist soil means the plant probably does not need more water right now, even if the hose is already emotionally involved.'
        },
        B: {
          title:'Exactly',
          text:'The soil gave you useful information. Trust it and check again later.'
        },
        C: {
          title:'Kind, but optional',
          text:'The tomato will likely recover from the brief intrusion. The important part is that you checked the soil before watering.'
        }
      };
      box.style.display = 'block';
      box.innerHTML = `&lt;h3&gt;${responses[choice].title}&lt;/h3&gt;&lt;p&gt;${responses[choice].text}&lt;/p&gt;`;
    }

    function showRhythmFeedback(choice){
      const box = document.getElementById('rhythmFeedback');
      const responses = {
        A: {
          title:'Correct',
          text:'Rain counts. If the soil is still damp, leave it alone and check again later.'
        },
        B: {
          title:'Routines are helpful, but soggy soil is not the goal',
          text:'If the soil is still damp, skip watering for now. You do not need to redo yesterday’s rain.'
        },
        C: {
          title:'A little harsh',
          text:'The zucchini may be dramatic, but it does not need abandonment. Just check the soil again later.'
        }
      };
      box.style.display = 'block';
      box.innerHTML = `&lt;h3&gt;${responses[choice].title}&lt;/h3&gt;&lt;p&gt;${responses[choice].text}&lt;/p&gt;`;
    }

    document.addEventListener('keydown', (e) =&gt; {
      if(e.key === 'ArrowRight') nextScene();
      if(e.key === 'ArrowLeft') prevScene();
    });

    updateScene();

            &lt;p&gt;Use the softest, ripest, or bruised tomatoes first for sandwiches, salsa, sauce, roasted tomatoes, soup, or freezing.&lt;/p&gt;
            &lt;p&gt;Future-you can deal with the skins. Future-you is resourceful.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/tomatosauce.png&quot; alt=&quot;A bowl of ripe tomatoes with a few imperfect ones being used for sauce.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 6 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Peppers&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 4 · Peppers are surprisingly helpful&lt;/div&gt;
          &lt;h2&gt;When in Doubt, Chop and Freeze&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Peppers are one of the easiest vegetables to preserve without making it a whole thing.&lt;/p&gt;
            &lt;p&gt;Wash them, remove the seeds, chop or slice them, and move them into a freezer bag.&lt;/p&gt;
            &lt;p&gt;Frozen peppers are excellent for soups, fajitas, chili, casseroles, and future meals where texture has agreed to be flexible.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/choppedpeppers.png&quot; alt=&quot;Chopped colorful peppers spread on a tray for freezing.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 7 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Zucchini&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 5 · Zucchini requires boundaries&lt;/div&gt;
          &lt;h2&gt;The Canoe Phase Is a Choice Point&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;A small zucchini is charming. A medium zucchini is useful.&lt;/p&gt;
            &lt;p&gt;An enormous zucchini is a project wearing a vegetable costume.&lt;/p&gt;
            &lt;p&gt;Shred it, squeeze out extra moisture, portion it into bags, freeze it flat, and label the bag before February becomes confusing.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/giantzucchinihelp.png&quot; alt=&quot;A giant zucchini next to a grater, freezer bags, and a humorous send help vibe.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 8 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Potatoes&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 6 · Potatoes need sorting, not drama&lt;/div&gt;
          &lt;h2&gt;Treasure Still Needs a Plan&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Use nicked, cut, bruised, or damaged potatoes first. These are not storage potatoes.&lt;/p&gt;
            &lt;p&gt;Healthy potatoes can be cured in a cool, dark, well-ventilated place so the skins toughen up.&lt;/p&gt;
            &lt;p&gt;Do not wash potatoes before storing. Moisture is where stored potatoes begin making unfortunate choices.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/potatosorting.png&quot; alt=&quot;Potatoes being sorted into use soon and store piles.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 9 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Butternut Squash&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 7 · Butternut squash is future food&lt;/div&gt;
          &lt;h2&gt;It Sits Quietly Until You Are Ready for Soup&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Butternut squash is the long game.&lt;/p&gt;
            &lt;p&gt;After harvest, cure it in a warm, dry, ventilated place for 1–2 weeks.&lt;/p&gt;
            &lt;p&gt;Then store it somewhere cool and dry with good airflow, and use any squash with broken stems or soft spots first.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/butternutcuring.png&quot; alt=&quot;Butternut squash curing or stored neatly for fall meals.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 10 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Freezer&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 8 · The freezer is your friend&lt;/div&gt;
          &lt;h2&gt;You Do Not Have to Become a Pioneer Reenactor&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Freezing is one of the easiest ways to preserve a harvest without canning everything.&lt;/p&gt;
            &lt;p&gt;Chopped peppers, shredded zucchini, whole tomatoes, sauce, roasted vegetables, and soup all freeze well.&lt;/p&gt;
            &lt;p&gt;Freeze things flat when possible, and label everything. Your future self deserves fewer mysteries.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/freezerbags.png&quot; alt=&quot;Freezer bags labeled peppers, zucchini, tomatoes, and soup.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 11 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Freezer Interaction&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Interaction · Freezer decision&lt;/div&gt;
          &lt;h2&gt;You have more peppers than you can use this week. What is the easiest low-drama preservation move?&lt;/h2&gt;
          &lt;div class=&quot;choice-grid&quot;&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showFreezerFeedback('A')&quot;&gt;A. Chop and freeze them.&lt;/button&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showFreezerFeedback('B')&quot;&gt;B. Ignore them until they wrinkle with disappointment.&lt;/button&gt;
            &lt;button class=&quot;choice&quot; onclick=&quot;showFreezerFeedback('C')&quot;&gt;C. Build an elaborate canning station despite not wanting to can.&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;feedback-box&quot; id=&quot;freezerFeedback&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 12 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Sharing&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 9 · Sharing counts as harvest success&lt;/div&gt;
          &lt;h2&gt;You Do Not Have to Personally Eat Every Vegetable&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Giving tomatoes to a neighbor counts. Sending peppers home with a friend counts.&lt;/p&gt;
            &lt;p&gt;The garden does not become less successful because someone else eats the food.&lt;/p&gt;
            &lt;p&gt;Just try to share while the produce is still appealing. Do not wait until the zucchini requires a waiver.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/sharingwithneighbor.png&quot; alt=&quot;A gardener handing vegetables to a neighbor or friend.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 13 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Imperfect Vegetables&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 10 · Imperfect vegetables still count&lt;/div&gt;
          &lt;h2&gt;Weird Still Counts&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Garden vegetables may be curved, scarred, small, oversized, bumpy, split, or shaped like they are trying to communicate.&lt;/p&gt;
            &lt;p&gt;This does not mean you failed. It means you grew food outside.&lt;/p&gt;
            &lt;p&gt;Cut away small damaged spots, compost anything moldy or deeply suspicious, and celebrate the usable parts.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/funnyvegetables.png&quot; alt=&quot;A lineup of funny-looking but lovable vegetables.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 14 --&gt;
    &lt;section class=&quot;scene&quot; data-title=&quot;Redemption&quot; style=&quot;--scene-bg:linear-gradient(180deg,#f5c47e 0%,#a1764e 45%,#3d5536 100%);&quot;&gt;
      &lt;div class=&quot;scene-card&quot;&gt;
        &lt;div class=&quot;text-side&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Part 11 · Redemption is using what you can&lt;/div&gt;
          &lt;h2&gt;The Garden Is Not Grading You&lt;/h2&gt;
          &lt;div class=&quot;copy&quot;&gt;
            &lt;p&gt;Harvest redemption is not about becoming a perfect homesteader.&lt;/p&gt;
            &lt;p&gt;Some food will be eaten fresh. Some will be frozen. Some will be shared. Some will become soup.&lt;/p&gt;
            &lt;p&gt;Some will become compost because you are human and time is real. That is okay.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;visual-side&quot;&gt;
          &lt;img src=&quot;https://cestuve.github.io/garden/freezerveggies.png&quot; alt=&quot;A peaceful kitchen scene with some vegetables cooked, some frozen, some shared, and a small compost bowl nearby.&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scene 15 --&gt;
    &lt;section class=&quot;scene end-match&quot; data-title=&quot;End&quot; style=&quot;--scene-bg:linear-gradient(180deg,#f5c47e 0%,#a1764e 45%,#3d5536 100%);&quot;&gt;
      &lt;div class=&quot;scene-card full&quot;&gt;
        &lt;div class=&quot;end-card&quot;&gt;
          &lt;div class=&quot;eyebrow&quot; style=&quot;margin-inline:auto;&quot;&gt;End of Episode 8&lt;/div&gt;
          &lt;h2&gt;Harvest Redemption&lt;/h2&gt;
          &lt;p class=&quot;subtitle&quot; style=&quot;margin-inline:auto;&quot;&gt;Use what you can, save what you can, share what you can, and compost without shame.&lt;/p&gt;
          &lt;div class=&quot;next-episode&quot;&gt;
            &lt;strong&gt;Next Episode&lt;/strong&gt;
            &lt;span&gt;Summary&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;nav class=&quot;nav&quot;&gt;
      &lt;button class=&quot;btn secondary&quot; id=&quot;backBtn&quot; onclick=&quot;prevScene()&quot;&gt;Back&lt;/button&gt;
      &lt;button class=&quot;btn primary&quot; id=&quot;nextBtn&quot; onclick=&quot;nextScene()&quot;&gt;Next&lt;/button&gt;
    &lt;/nav&gt;
  &lt;/main&gt;

  &lt;script&gt;
    const scenes = Array.from(document.querySelectorAll('.scene'));
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    let current = 0;

    function updateScene(){
      scenes.forEach((scene, i) =&gt; scene.classList.toggle('active', i === current));
      const total = scenes.length;
      progressBar.style.width = ((current + 1) / total * 100) + '%';
      progressLabel.textContent = `${current + 1} / ${total}`;
      backBtn.disabled = current === 0;
      nextBtn.textContent = current === total - 1 ? 'Summary' : 'Next';
      window.scrollTo(0,0);
    }

    function nextScene(){
      if(current &lt; scenes.length - 1){
        current++;
        updateScene();
      } else {
        parent.postMessage({type:'garden-go', target:'summary'}, '*');
      }
    }

    function prevScene(){
      if(current &gt; 0){
        current--;
        updateScene();
      }
    }

    function showTriageFeedback(choice){
      const box = document.getElementById('triageFeedback');
      const responses = {
        A: {
          title:'Relatable, but risky',
          text:'The counter is where good intentions often become compost-adjacent. A quick sort keeps the harvest moving.'
        },
        B: {
          title:'Bold, but deeply unnecessary',
          text:'Please process the current zucchini situation before inviting additional zucchini into your life.'
        },
        C: {
          title:'Exactly',
          text:'A quick sort turns harvest chaos into a manageable plan: eat soon, store, freeze, or share.'
        }
      };
      box.style.display = 'block';
      box.innerHTML = `&lt;h3&gt;${responses[choice].title}&lt;/h3&gt;&lt;p&gt;${responses[choice].text}&lt;/p&gt;`;
    }

    function showFreezerFeedback(choice){
      const box = document.getElementById('freezerFeedback');
      const responses = {
        A: {
          title:'Correct',
          text:'Peppers freeze beautifully for cooked meals later. Chop, freeze flat, bag, label, and move on with your life.'
        },
        B: {
          title:'Understandable, but not ideal',
          text:'A few minutes of chopping can rescue the situation before the peppers enter their wrinkle era.'
        },
        C: {
          title:'Unnecessary',
          text:'You are allowed to choose the easy preservation method that actually fits your life. The freezer is right there.'
        }
      };
      box.style.display = 'block';
      box.innerHTML = `&lt;h3&gt;${responses[choice].title}&lt;/h3&gt;&lt;p&gt;${responses[choice].text}&lt;/p&gt;`;
    }

    document.addEventListener('keydown', (e) =&gt; {
      if(e.key === 'ArrowRight') nextScene();
      if(e.key === 'ArrowLeft') prevScene();
    });

    updateScene();
  &lt;/script&gt;

&lt;script&gt;
(function(){
  const vegetables = ['🍅','🥒','🫑','🥔','🌽','🥕','🧄','🧅','🍆','🥬','🥦','🍠'];
  let lastLaunch = 0;

  function launchVeggieConfetti(){
    const now = Date.now();
    if(now - lastLaunch &lt; 1400) return;
    lastLaunch = now;

    const count = 78;
    for(let i = 0; i &lt; count; i++){
      const piece = document.createElement('span');
      piece.className = 'veggie-confetti';
      piece.textContent = vegetables[Math.floor(Math.random() * vegetables.length)];
      const duration = 2400 + Math.random() * 2500;
      const delay = Math.random() * 850;
      piece.style.setProperty('--x', (Math.random() * 100) + 'vw');
      piece.style.setProperty('--drift', ((Math.random() * 180) - 90) + 'px');
      piece.style.setProperty('--rot', ((Math.random() * 900) - 450) + 'deg');
      piece.style.setProperty('--dur', duration + 'ms');
      piece.style.setProperty('--delay', delay + 'ms');
      document.body.appendChild(piece);
      window.setTimeout(() =&gt; piece.remove(), duration + delay + 400);
    }
  }

  window.addEventListener('message', function(event){
    if(event &amp;&amp; event.data &amp;&amp; event.data.type === 'garden-summary-confetti'){
      launchVeggieConfetti();
    }
  });

  window.addEventListener('load', function(){
    window.setTimeout(launchVeggieConfetti, 350);
  });
})();

<script>
(function(){
  const frames = Array.from(document.querySelectorAll('.module-frame'));
  const tabs = Array.from(document.querySelectorAll('.module-tab'));
  const menu = document.getElementById('courseMenu');
  const toggle = document.getElementById('courseMenuToggle');
  let current = 'intro';

  function getIntroFrame(){
    return frames.find(f => f.dataset.module === 'intro');
  }

  function sendIntroMessage(type){
    const frame = getIntroFrame();
    if(!frame || !frame.contentWindow) return;
    try { frame.contentWindow.postMessage({type}, '*'); } catch(e) {}
  }

  function scrollIntroToTop(){
    const frame = getIntroFrame();
    if(!frame) return;
    try {
      const doc = frame.contentDocument || frame.contentWindow.document;
      const target = doc.getElementById('top') || doc.body || doc.documentElement;
      if(target && typeof target.scrollIntoView === 'function') {
        target.scrollIntoView({behavior:'auto', block:'start'});
      }
      frame.contentWindow.scrollTo(0, 0);
      sendIntroMessage('garden-intro-top');
    } catch(e) {}
  }

  function scrollIntroToOpening(){
    const frame = getIntroFrame();
    if(!frame) return;
    try {
      const doc = frame.contentDocument || frame.contentWindow.document;
      const target = doc.getElementById('opening');
      if(target && typeof target.scrollIntoView === 'function') {
        target.scrollIntoView({behavior:'smooth', block:'start'});
      } else {
        frame.contentWindow.scrollTo({top: frame.clientHeight || 700, left:0, behavior:'smooth'});
      }
      sendIntroMessage('garden-intro-scroll');
    } catch(e) {}
  }

  function showModule(id, options = {}){
    const targetId = id === 'intro-top' ? 'intro' : id;
    const frame = frames.find(f => f.dataset.module === targetId);
    if(!frame) return;
    current = targetId;
    frames.forEach(f => f.classList.toggle('active', f.dataset.module === targetId));
    tabs.forEach(t => t.classList.toggle('active', t.dataset.target === targetId || (targetId === 'intro' && t.dataset.target === 'intro-top')));
    menu.classList.remove('open');
    toggle.setAttribute('aria-expanded','false');
    try { frame.contentWindow.focus(); } catch(e) {}
    if(targetId === 'intro') {
      setTimeout(() => {
        if(options.opening) scrollIntroToOpening();
        else scrollIntroToTop();
      }, 80);
    }
    if(targetId === 'summary') {
      setTimeout(() => {
        try { frame.contentWindow.postMessage({type:'garden-summary-confetti'}, '*'); } catch(e) {}
      }, 180);
    }
  }

  tabs.forEach(tab => tab.addEventListener('click', () => {
    const target = tab.dataset.target;
    if(target === 'intro') showModule('intro', {top:true});
    else showModule(target);
  }));

  toggle.addEventListener('click', () => {
    const open = menu.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  window.addEventListener('message', (event) => {
    if(!event || !event.data) return;
    if(event.data.type === 'garden-go') showModule(event.data.target);
    if(event.data.type === 'garden-scroll-intro') showModule('intro', {opening:true});
  });

  document.addEventListener('keydown', (event) => {
    if(event.key === 'Escape') {
      menu.classList.remove('open');
      toggle.setAttribute('aria-expanded','false');
    }
  });

  showModule('intro', {top:true});
})();
</script>
</body>
</html>
